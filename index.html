}

// ---------- Invoices (with line items) ----------
function InvoicesTab({ invoices, projects, suppliers, upsert, remove }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editingInvoice, setEditingInvoice] = useState(null);
  const [typeFilter, setTypeFilter] = useState("الكل");
  const [supplierQuery, setSupplierQuery] = useState("");
  const [invoiceNumberQuery, setInvoiceNumberQuery] = useState("");
  const [pendingDelete, setPendingDelete] = useState(null);
  const [expanded, setExpanded] = useState(null);

  const normalizedSupplierQuery = normalizeName(supplierQuery);
  const normalizedInvoiceNumberQuery = normalizeName(invoiceNumberQuery);
  const filtered = invoices.filter((i) => {
    const matchType = typeFilter === "الكل" || i.type === typeFilter;
    const matchSupplier = !normalizedSupplierQuery || normalizeName(i.supplierName).includes(normalizedSupplierQuery);
    const matchInvoiceNumber = !normalizedInvoiceNumberQuery || normalizeName(i.invoiceNumber).includes(normalizedInvoiceNumberQuery);
    return matchType && matchSupplier && matchInvoiceNumber;
  });
  const total = filtered.reduce((s, i) => s + Number(i.amount || 0), 0);
  const sorted = [...filtered].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const deleteInvoice = (invoice) => {
    remove("invoices", invoice.id);
    if (invoice.supplierId && invoice.debtTransactionId) {
      const supplier = suppliers.find((s) => s.id === invoice.supplierId);
      if (supplier) upsert("suppliers", { ...supplier, transactions: (supplier.transactions || []).filter((t) => t.id !== invoice.debtTransactionId) });
    }
  };
  const syncSupplierDebt = (supplierId, transactionId, transaction) => {
    if (!supplierId || !transactionId) return;
    const supplier = suppliers.find((s) => s.id === supplierId);
    if (supplier) upsert("suppliers", upsertSupplierDebt(supplier, transaction));
  };
  const saveInvoice = (invoice) => {
    upsert("invoices", invoice);
    if (editingInvoice?.supplierId && editingInvoice.debtTransactionId && (editingInvoice.supplierId !== invoice.supplierId || !invoice.debtTransactionId)) {
      const oldSupplier = suppliers.find((s) => s.id === editingInvoice.supplierId);
      if (oldSupplier) upsert("suppliers", { ...oldSupplier, transactions: (oldSupplier.transactions || []).filter((t) => t.id !== editingInvoice.debtTransactionId) });
    }
    syncSupplierDebt(invoice.supplierId, invoice.debtTransactionId, { id: invoice.debtTransactionId, date: invoice.date, type: "debit", amount: invoice.amount, note: "فاتورة " + (invoice.invoiceNumber ? "#" + invoice.invoiceNumber : invoice.type) });
    setEditingInvoice(null);
  };

  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>الفواتير</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>مواد خام، مواد بناء، كهرباء وغيرها — مع تفاصيل البنود</p></div>
        <PrimaryButton onClick={() => setShowAdd(true)}><Icon name="plus" size={16} /> فاتورة جديدة</PrimaryButton>
      </div>
      <div className="flex items-center gap-3 flex-wrap">
        <div className="flex gap-1.5 flex-wrap">{["الكل", ...INVOICE_TYPES].map((t) => <button key={t} onClick={() => setTypeFilter(t)} className="text-xs px-3 py-2 rounded-lg border transition" style={typeFilter === t ? { background: "var(--accent)", borderColor: "var(--accent)", color: "white" } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-body)" }}>{t}</button>)}</div>
        <div className="relative min-w-[180px] flex-1"><span className="absolute right-3 top-1/2 -translate-y-1/2" style={{ color: "var(--text-muted)" }}><Icon name="search" size={15} /></span><TextInput value={supplierQuery} onChange={(e) => setSupplierQuery(e.target.value)} placeholder="بحث باسم المورد..." className="pr-9" /></div>
        <div className="relative min-w-[150px] flex-1"><span className="absolute right-3 top-1/2 -translate-y-1/2" style={{ color: "var(--text-muted)" }}>#</span><TextInput value={invoiceNumberQuery} onChange={(e) => setInvoiceNumberQuery(e.target.value)} placeholder="بحث برقم الفاتورة..." className="pr-8" /></div>
        <div className="mr-auto rounded-lg px-4 py-2 text-sm" style={{ background: "var(--divider)" }}><span className="ml-1" style={{ color: "var(--text-muted)" }}>الإجمالي:</span><span className="font-bold" style={{ color: "var(--text-strong)" }}>{fmt(total)}</span></div>
      </div>
      {sorted.length === 0 ? <EmptyState icon="receipt" title="لا توجد فواتير" sub="أضف أول فاتورة لتبدأ" /> : (
        <div className="rounded-2xl border overflow-hidden" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {sorted.map((inv) => (
              <div key={inv.id} style={{ borderColor: "var(--divider)" }}>
                <button onClick={() => setExpanded(expanded === inv.id ? null : inv.id)} className="w-full flex items-center justify-between px-4 py-3 gap-2 text-right">
                  <div className="min-w-0">
                    <div className="text-sm font-medium truncate flex items-center gap-1.5" style={{ color: "var(--text-body)" }}>
                      {inv.supplierName || "بدون اسم مورّد"} {inv.invoiceNumber && <span className="text-xs font-normal" style={{ color: "var(--text-muted)" }}>#{inv.invoiceNumber}</span>}
                    </div>
                    <div className="text-xs flex items-center gap-1.5 mt-0.5 flex-wrap" style={{ color: "var(--text-muted)" }}>
                      <Badge bg="var(--divider)" fg="#8A6A32">{inv.type}</Badge>{inv.date}
                      {inv.projectId && <span style={{ color: "var(--accent)" }}>· {projects.find((p) => p.id === inv.projectId)?.customerName || ""}</span>}
                      {(inv.items || []).length > 0 && <span>· {inv.items.length} بند</span>}
                    </div>
                  </div>
                  <span className="font-semibold shrink-0" style={{ color: "var(--text-strong)" }}>{fmt(inv.amount)}</span>
                </button>
                {expanded === inv.id && (
                  <div className="px-4 pb-3 flex flex-col gap-2">
                    {inv.description && <div className="text-xs" style={{ color: "var(--text-muted)" }}>{inv.description}</div>}
                    {(inv.items || []).length > 0 && (
                      <div className="rounded-lg p-2.5 flex flex-col gap-1" style={{ background: "var(--divider)" }}>
                        {inv.items.map((it, idx) => (
                          <div key={idx} className="flex items-center justify-between text-xs" style={{ color: "var(--text-body)" }}>
                            <span>{it.name} {it.quantity ? `(${fmt(it.quantity)} ${it.unit || ""} × ${fmt(it.unitPrice)})` : ""}</span>
                            <span className="font-medium">{fmt(it.total)}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    <div className="flex justify-end">
                      {pendingDelete === inv.id ? <ConfirmInline onConfirm={() => { deleteInvoice(inv); setPendingDelete(null); }} onCancel={() => setPendingDelete(null)} /> : <div className="flex items-center gap-3"><button onClick={() => setEditingInvoice(inv)} className="text-xs" style={{ color: "var(--accent)" }}>تعديل الفاتورة</button><button onClick={() => setPendingDelete(inv.id)} className="text-xs flex items-center gap-1" style={{ color: "#A34632" }}><Icon name="trash" size={13} /> حذف الفاتورة</button></div>}
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}
      {showAdd && <Modal title="فاتورة جديدة" onClose={() => setShowAdd(false)} wide><AddInvoiceForm projects={projects} suppliers={suppliers} upsert={upsert} onAdd={(inv) => { saveInvoice(inv); setShowAdd(false); }} /></Modal>}
      {editingInvoice && <Modal title="تعديل الفاتورة" onClose={() => setEditingInvoice(null)} wide><AddInvoiceForm initialInvoice={editingInvoice} projects={projects} suppliers={suppliers} upsert={upsert} onAdd={saveInvoice} /></Modal>}
    </div>
  );
}

function AddInvoiceForm({ onAdd, projects, suppliers, upsert, initialInvoice = null }) {
  const [invoiceNumber, setInvoiceNumber] = useState(initialInvoice?.invoiceNumber || "");
  const [type, setType] = useState(initialInvoice?.type || INVOICE_TYPES[0]);
  const [supplierId, setSupplierId] = useState(initialInvoice?.supplierId || "");
  const [supplierName, setSupplierName] = useState(initialInvoice?.supplierName || "");
  const [amount, setAmount] = useState(initialInvoice?.amount ? String(initialInvoice.amount) : "");
  const [date, setDate] = useState(initialInvoice?.date || todayISO());
  const [description, setDescription] = useState(initialInvoice?.description || "");
  const [projectId, setProjectId] = useState(initialInvoice?.projectId || "");
  const [markAsDebt, setMarkAsDebt] = useState(Boolean(initialInvoice?.debtTransactionId));
  const [items, setItems] = useState(initialInvoice?.items?.length ? initialInvoice.items : [{ name: "", quantity: "", unit: "قطعة", unitPrice: "", total: "" }]);

  const setItem = (idx, patch) => setItems((prev) => prev.map((it, i) => { if (i !== idx) return it; const next = { ...it, ...patch }; if (next.quantity && next.unitPrice && nonNegativeNumber(next.quantity) && nonNegativeNumber(next.unitPrice)) next.total = String(Number(next.quantity) * Number(next.unitPrice)); return next; }));
  const addRow = () => setItems((prev) => [...prev, { name: "", quantity: "", unit: "قطعة", unitPrice: "", total: "" }]);
  const removeRow = (idx) => setItems((prev) => prev.filter((_, i) => i !== idx));
  const itemsTotal = items.reduce((s, it) => s + Number(it.total || 0), 0);
  const effectiveAmount = itemsTotal > 0 ? itemsTotal : Number(amount || 0);

  useEffect(() => {
    const sup = suppliers.find((s) => s.id === supplierId);
    if (sup) setSupplierName(sup.name);
  }, [supplierId]);

  const submit = () => {
    if (!positiveNumber(effectiveAmount) || Number(effectiveAmount) < 0) { notify("مبلغ الفاتورة يجب أن يكون موجبًا."); return; }
    const cleanItems = items.filter((it) => it.name.trim() && positiveNumber(it.total) && nonNegativeNumber(it.quantity || 0) && nonNegativeNumber(it.unitPrice || 0)).map((it) => ({ name: it.name.trim(), quantity: Number(it.quantity || 0), unit: it.unit, unitPrice: Number(it.unitPrice || 0), total: Number(it.total) }));
    const debtTransactionId = markAsDebt && supplierId ? (initialInvoice?.debtTransactionId || uid()) : null;
    const inv = {
      id: initialInvoice?.id || uid(), invoiceNumber: invoiceNumber.trim(), type, supplierId: supplierId || null, supplierName: supplierName.trim(),
      amount: effectiveAmount, date, description: description.trim(), projectId: type === "مواد بناء" ? (projectId || null) : null, items: cleanItems, debtTransactionId,
    };
    onAdd(inv);
  };

  return (
    <div className="flex flex-col gap-3">
      <div className="grid sm:grid-cols-2 gap-3">
        <div><FieldLabel>نوع الفاتورة</FieldLabel><Select value={type} onChange={(e) => setType(e.target.value)}>{INVOICE_TYPES.map((t) => <option key={t}>{t}</option>)}</Select></div>
        <div><FieldLabel>رقم الفاتورة (اختياري)</FieldLabel><TextInput value={invoiceNumber} onChange={(e) => setInvoiceNumber(e.target.value)} /></div>
      </div>
      {type === "مواد بناء" && (
        <div><FieldLabel>حمّل التكلفة على مشروع (اختياري)</FieldLabel><Select value={projectId} onChange={(e) => setProjectId(e.target.value)}><option value="">بدون تحديد</option>{projects.map((p) => <option key={p.id} value={p.id}>{p.customerName} — {p.location}</option>)}</Select></div>
      )}
      <div className="grid sm:grid-cols-2 gap-3">
        <div>
          <FieldLabel>المورّد المسجّل (اختياري)</FieldLabel>
          <Select value={supplierId} onChange={(e) => setSupplierId(e.target.value)}><option value="">بدون ربط — اكتب الاسم يدويًا</option>{suppliers.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}</Select>
        </div>
        <div><FieldLabel>اسم المورّد / الجهة</FieldLabel><TextInput value={supplierName} onChange={(e) => setSupplierName(e.target.value)} placeholder="مثال: شركة مواد البناء" /></div>
      </div>
      {supplierId && (
        <label className="flex items-center gap-2 text-xs" style={{ color: "var(--text-body)" }}>
          <input type="checkbox" checked={markAsDebt} onChange={(e) => setMarkAsDebt(e.target.checked)} /> الفاتورة غير مدفوعة — سجّل قيمتها كمستحق علينا للمورد
        </label>
      )}

      <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
        <FieldLabel>بنود الفاتورة (اختياري — أو أدخل مبلغًا إجماليًا أدناه)</FieldLabel>
        {items.map((it, idx) => (
          <div key={idx} className="grid grid-cols-2 sm:grid-cols-12 gap-1.5 items-center">
            <div className="col-span-2 sm:col-span-3 min-w-0"><TextInput placeholder="اسم المادة" value={it.name} onChange={(e) => setItem(idx, { name: e.target.value })} /></div>
            <div className="col-span-1 sm:col-span-2 min-w-0"><TextInput type="number" placeholder="كمية" value={it.quantity} onChange={(e) => setItem(idx, { quantity: e.target.value })} /></div>
            <div className="col-span-1 sm:col-span-2 min-w-0"><TextInput placeholder="وحدة" value={it.unit} onChange={(e) => setItem(idx, { unit: e.target.value })} /></div>
            <div className="col-span-1 sm:col-span-2 min-w-0"><TextInput type="number" placeholder="السعر" value={it.unitPrice} onChange={(e) => setItem(idx, { unitPrice: e.target.value })} /></div>
            <div className="col-span-1 sm:col-span-2 min-w-0"><TextInput type="number" placeholder="الإجمالي" value={it.total} onChange={(e) => setItem(idx, { total: e.target.value })} /></div>
            <div className="col-span-2 sm:col-span-1 flex justify-center">{items.length > 1 && <button onClick={() => removeRow(idx)} style={{ color: "var(--text-muted)" }}><Icon name="x" size={14} /></button>}</div>
          </div>
        ))}
        <button onClick={addRow} className="text-xs flex items-center gap-1 self-start" style={{ color: "var(--accent)" }}><Icon name="plus" size={12} /> إضافة بند</button>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div><FieldLabel>{itemsTotal > 0 ? "المبلغ الإجمالي (محسوب من البنود)" : "المبلغ الإجمالي"}</FieldLabel><TextInput type="number" value={itemsTotal > 0 ? itemsTotal : amount} onChange={(e) => setAmount(e.target.value)} disabled={itemsTotal > 0} /></div>
        <div><FieldLabel>التاريخ</FieldLabel><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div>
      </div>
      <div><FieldLabel>وصف (اختياري)</FieldLabel><TextInput value={description} onChange={(e) => setDescription(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!effectiveAmount}><Icon name="plus" size={16} /> {initialInvoice ? "حفظ تعديل الفاتورة" : "حفظ الفاتورة"}</PrimaryButton>
    </div>
  );
}

// ---------- Finance ----------
function FinanceTab({ expenses, income, projects, customers = [], upsert, remove }) {
  const [sub, setSub] = useState("expenses");
  const [showAdd, setShowAdd] = useState(false);
  const [editingExpense, setEditingExpense] = useState(null);
  const [editingIncome, setEditingIncome] = useState(null);
  const [pendingDelete, setPendingDelete] = useState(null);
  const allIncome = getAllProjectIncome(projects, income);
  const list = sub === "expenses" ? expenses : allIncome;
  const sorted = [...list].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const totalExpenses = expenses.reduce((s, x) => s + Number(x.amount || 0), 0);
  const totalIncome = allIncome.reduce((s, x) => s + Number(x.amount || 0), 0);
  const saveIncome = (nextIncome) => {
    const previousProjectId = editingIncome?.projectId;
    if (previousProjectId && previousProjectId !== nextIncome.projectId) {
      const previousProject = projects.find((project) => project.id === previousProjectId);
      if (previousProject) upsert("projects", { ...previousProject, payments: (previousProject.payments || []).filter((payment) => (payment.paymentId || payment.id) !== (editingIncome.paymentId || editingIncome.id)) });
    }
    if (nextIncome.projectId) {
      const nextProject = projects.find((project) => project.id === nextIncome.projectId);
      if (nextProject) {
        const payment = { id: nextIncome.paymentId || nextIncome.id, paymentId: nextIncome.paymentId || nextIncome.id, date: nextIncome.date, amount: nextIncome.amount, includeInIncome: nextIncome.includeInIncome !== false, description: nextIncome.description };
        const payments = nextProject.payments || [];
        const paymentKey = payment.paymentId || payment.id;
        const nextPayments = payments.some((item) => (item.paymentId || item.id) === paymentKey)
          ? payments.map((item) => (item.paymentId || item.id) === paymentKey ? { ...item, ...payment } : item)
          : [payment, ...payments];
        upsert("projects", { ...nextProject, payments: nextPayments });
      }
    }
    upsert("income", nextIncome);
    setEditingIncome(null);
  };
  const deleteIncome = (entry) => {
    if (entry.projectId) {
      const project = projects.find((item) => item.id === entry.projectId);
      if (project) upsert("projects", { ...project, payments: (project.payments || []).filter((payment) => (payment.paymentId || payment.id) !== (entry.paymentId || entry.id)) });
    }
    remove("income", entry.id);
  };
  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>المصاريف والواردات</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>مصاريف تشغيل المصنع، وواردات المشاريع</p></div>
        <PrimaryButton onClick={() => setShowAdd(true)}><Icon name="plus" size={16} /> {sub === "expenses" ? "مصروف جديد" : "وارد جديد"}</PrimaryButton>
      </div>
      <div className="grid grid-cols-3 gap-3">
        <StatCard icon="trendDown" label="إجمالي المصاريف" value={fmt(totalExpenses)} accent="#A34632" />
        <StatCard icon="trendUp" label="إجمالي الواردات" value={fmt(totalIncome)} accent="#4B6350" />
        <StatCard icon="wallet" label="الصافي" value={fmt(totalIncome - totalExpenses)} accent="#8A6A32" />
      </div>
      <div className="flex gap-1.5">
        <button onClick={() => setSub("expenses")} className="text-sm px-4 py-2 rounded-lg border transition" style={sub === "expenses" ? { background: "var(--accent)", borderColor: "var(--accent)", color: "white" } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-body)" }}>مصاريف المصنع</button>
        <button onClick={() => setSub("income")} className="text-sm px-4 py-2 rounded-lg border transition" style={sub === "income" ? { background: "var(--accent)", borderColor: "var(--accent)", color: "white" } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-body)" }}>واردات المشاريع</button>
      </div>
      {sorted.length === 0 ? <EmptyState icon="wallet" title={sub === "expenses" ? "لا توجد مصاريف مسجّلة" : "لا توجد واردات مسجّلة"} /> : (
        <div className="rounded-2xl border overflow-hidden" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {sorted.map((x) => (
              <div key={x.id} className="flex items-center justify-between px-4 py-3 gap-2" style={{ borderColor: "var(--divider)" }}>
                <div className="min-w-0"><div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>{sub === "expenses" ? x.type : (x.customerName || "وارد")}</div><div className="text-xs mt-0.5" style={{ color: "var(--text-muted)" }}>{x.date} {x.projectId ? "· " + (projects.find((project) => project.id === x.projectId)?.customerName || "مشروع") : ""} {x.description ? "· " + x.description : ""}</div></div>
                <div className="flex items-center gap-3 shrink-0">
                  <span className="font-semibold" style={{ color: sub === "expenses" ? "#A34632" : "#4B6350" }}>{sub === "expenses" ? "−" : "+"}{fmt(x.amount)}</span>
                  {pendingDelete === x.id ? <ConfirmInline onConfirm={() => { sub === "expenses" ? remove("expenses", x.id) : deleteIncome(x); setPendingDelete(null); }} onCancel={() => setPendingDelete(null)} /> : <div className="flex items-center gap-3"><button onClick={() => sub === "expenses" ? setEditingExpense(x) : setEditingIncome(x)} className="text-xs" style={{ color: "var(--accent)" }}>تعديل</button><button onClick={() => setPendingDelete(x.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button></div>}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
      {showAdd && sub === "expenses" && <Modal title="مصروف جديد" onClose={() => setShowAdd(false)}><AddExpenseForm onAdd={(e) => { upsert("expenses", e); setShowAdd(false); }} /></Modal>}
      {showAdd && sub === "income" && <Modal title="وارد جديد" onClose={() => setShowAdd(false)}><AddIncomeForm projects={projects} customers={customers} onAdd={(e) => { upsert("income", e); setShowAdd(false); }} /></Modal>}
      {editingExpense && <Modal title="تعديل المصروف" onClose={() => setEditingExpense(null)}><AddExpenseForm initialExpense={editingExpense} onAdd={(e) => { upsert("expenses", e); setEditingExpense(null); }} /></Modal>}
      {editingIncome && <Modal title="تعديل الوارد" onClose={() => setEditingIncome(null)}><AddIncomeForm initialIncome={editingIncome} projects={projects} customers={customers} onAdd={saveIncome} /></Modal>}
    </div>
  );
}
function AddExpenseForm({ onAdd, initialExpense = null }) {
  const [type, setType] = useState(initialExpense?.type || EXPENSE_TYPES[0]);
  const [amount, setAmount] = useState(initialExpense?.amount ? String(initialExpense.amount) : "");
  const [date, setDate] = useState(initialExpense?.date || todayISO());
  const [description, setDescription] = useState(initialExpense?.description || "");
  const submit = () => { if (!positiveNumber(amount) || Number(amount) < 0) { notify("المبلغ يجب أن يكون موجبًا."); return; } onAdd({ id: initialExpense?.id || uid(), type, amount: Number(amount), date, description: description.trim() }); };
  return (
    <div className="flex flex-col gap-3">
      <div><FieldLabel>نوع المصروف</FieldLabel><Select value={type} onChange={(e) => setType(e.target.value)}>{EXPENSE_TYPES.map((t) => <option key={t}>{t}</option>)}</Select></div>
      <div className="grid grid-cols-2 gap-3"><div><FieldLabel>المبلغ</FieldLabel><TextInput type="number" value={amount} onChange={(e) => setAmount(e.target.value)} /></div><div><FieldLabel>التاريخ</FieldLabel><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div></div>
      <div><FieldLabel>وصف (اختياري)</FieldLabel><TextInput value={description} onChange={(e) => setDescription(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!amount}><Icon name="plus" size={16} /> {initialExpense ? "حفظ تعديل المصروف" : "حفظ المصروف"}</PrimaryButton>
    </div>
  );
}
function AddIncomeForm({ onAdd, projects, customers = [], initialIncome = null }) {
  const initialCustomerId = initialIncome?.customerId || (!initialIncome?.projectId && initialIncome?.customerName ? (customers.find((c) => normalizeName(c.name) === normalizeName(initialIncome.customerName))?.id || "") : "");
  const [projectId, setProjectId] = useState(initialIncome?.projectId || "");
  const [customerId, setCustomerId] = useState(initialCustomerId);
  const [customerName, setCustomerName] = useState(initialIncome?.customerName || "");
  const [amount, setAmount] = useState(initialIncome?.amount ? String(initialIncome.amount) : "");
  const [date, setDate] = useState(initialIncome?.date || todayISO());
  const [description, setDescription] = useState(initialIncome?.description || "");
  const [includeInIncome, setIncludeInIncome] = useState(initialIncome?.includeInIncome !== false);
  const submit = () => {
    if (!positiveNumber(amount)) { notify("المبلغ يجب أن يكون موجبًا."); return; }
    const proj = projects.find((p) => p.id === projectId);
    const cust = !proj ? customers.find((c) => c.id === customerId) : null;
    onAdd({ ...initialIncome, id: initialIncome?.id || uid(), paymentId: initialIncome?.paymentId, projectId: projectId || null, customerId: cust ? cust.id : null, customerName: proj ? proj.customerName : (cust ? cust.name : customerName.trim()), amount: Number(amount), date, includeInIncome, description: description.trim() });
  };
  return (
    <div className="flex flex-col gap-3">
      <div>
        <FieldLabel>المشروع (اختياري)</FieldLabel>
        <SearchablePicker
          items={projects}
          value={projectId}
          onSelect={setProjectId}
          placeholder="ابحث باسم الزبون أو موقع المشروع..."
          getLabel={(project) => project.customerName + (project.location ? " — " + project.location : "")}
          getSearchText={(project) => [project.customerName, project.location, project.phone, project.dateCreated].filter(Boolean).join(" ")}
        />
      </div>
      {!projectId && (
        <div>
          <FieldLabel>الزبون (بدون مشروع)</FieldLabel>
          <SearchablePicker
            items={customers}
            value={customerId}
            onSelect={setCustomerId}
            placeholder="ابحث باسم الزبون أو رقم هاتفه..."
            getLabel={(customer) => customer.name + (customer.phone ? " — " + customer.phone : "")}
            getSearchText={(customer) => [customer.name, customer.phone].filter(Boolean).join(" ")}
            emptyText="لا يوجد زبون بهذا الاسم — أضفه من الحسابات أو اكتب الاسم أدناه"
          />
          {customerId ? (
            <div className="text-xs mt-1" style={{ color: "#4B6350" }}>سيُسجَّل هذا الوارد في حساب الزبون ويُخصم من المستحق عليه.</div>
          ) : (
            <div className="mt-2">
              <FieldLabel>أو اسم زبون غير مسجّل (لن يرتبط بحساب)</FieldLabel>
              <TextInput value={customerName} onChange={(e) => setCustomerName(e.target.value)} />
            </div>
          )}
        </div>
      )}
      <div className="grid grid-cols-2 gap-3"><div><FieldLabel>المبلغ</FieldLabel><TextInput type="number" value={amount} onChange={(e) => setAmount(e.target.value)} /></div><div><FieldLabel>التاريخ</FieldLabel><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div></div>
      <label className="flex items-center gap-2 text-xs" style={{ color: "var(--text-body)" }}><input type="checkbox" checked={includeInIncome} onChange={(e) => setIncludeInIncome(e.target.checked)} /> احتساب الدفعة ضمن الواردات</label>
      <div><FieldLabel>وصف (اختياري)</FieldLabel><TextInput value={description} onChange={(e) => setDescription(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!amount}><Icon name="plus" size={16} /> {initialIncome ? "حفظ تعديل الوارد" : "حفظ الوارد"}</PrimaryButton>
    </div>
  );
}

// ---------- Accounts (customers / workers / suppliers ledger) ----------
function AccountsTab({ sub, setSub, customers, suppliers, workers, invoices, upsert, remove, projects, income, onOpenProject }) {
  const KINDS = { customers: { label: "عملاء", icon: "users", collection: "customers", data: customers }, workers: { label: "عمال", icon: "user", collection: "workers", data: workers }, suppliers: { label: "موردون", icon: "briefcase", collection: "suppliers", data: suppliers } };
  const current = KINDS[sub];
  return (
    <div className="flex flex-col gap-5">
      <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>الحسابات والديون</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>عملاء، عمال، وموردون — مع متابعة المستحقات</p></div>
      <div className="flex gap-1.5">
        {Object.entries(KINDS).map(([k, v]) => (
          <button key={k} onClick={() => setSub(k)} className="text-sm px-4 py-2 rounded-lg border flex items-center gap-1.5 transition" style={sub === k ? { background: "var(--accent)", borderColor: "var(--accent)", color: "white" } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-body)" }}>
            <Icon name={v.icon} size={14} /> {v.label}
          </button>
        ))}
      </div>
      <ContactsList kind={sub} label={current.label} icon={current.icon} collection={current.collection} data={current.data} invoices={invoices} upsert={upsert} remove={remove} projects={projects} income={income} onOpenProject={onOpenProject} />
    </div>
  );
}

function ContactsList({ kind, label, icon, collection, data, invoices, upsert, remove, projects, income, onOpenProject }) {
  const [query, setQuery] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [openId, setOpenId] = useState(null);
  const filtered = data.filter((c) => !query || c.name.includes(query));
  const open = data.find((c) => c.id === openId);
  const relatedProjects = kind === "customers" && open ? projects.filter((p) => p.customerId === open.id || (!p.customerId && p.customerName === open.name)) : null;
  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center gap-3 flex-wrap">
        <div className="relative flex-1 min-w-[180px]">
          <span className="absolute right-3 top-1/2 -translate-y-1/2" style={{ color: "var(--text-muted)" }}><Icon name="search" size={15} /></span>
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={`بحث بالاسم بين ${label}...`} className="w-full rounded-lg border pr-9 pl-3 py-2 text-sm outline-none" style={{ background: "var(--input-bg)", borderColor: "var(--card-border)", color: "var(--text-strong)" }} />
        </div>
        <PrimaryButton onClick={() => setShowAdd(true)}><Icon name="plus" size={16} /> إضافة {label.replace(/ون$|اء$/, "")}</PrimaryButton>
      </div>
      {filtered.length === 0 ? <EmptyState icon={icon} title={`لا يوجد ${label} مسجّلون بعد`} /> : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {filtered.map((c) => {
            const bal = contactBalance(c);
            return (
              <button key={c.id} onClick={() => setOpenId(c.id)} className="text-right rounded-2xl border p-4 flex flex-col gap-2" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
                <div className="flex items-center justify-between">
                  <div className="font-semibold" style={{ color: "var(--text-strong)" }}>{c.name}</div>
                  <Icon name={icon} size={16} color="var(--text-muted)" />
                </div>
                {c.phone && <div className="text-xs flex items-center gap-1" style={{ color: "var(--text-muted)" }}><Icon name="phone" size={11} /> {c.phone}</div>}
                <div className="pt-2 border-t" style={{ borderColor: "var(--divider)" }}>
                  {bal > 0 && <Badge bg="var(--warn-bg)" fg="#A34632">{kind === "suppliers" ? "علينا" : "عليه"} {fmt(bal)}</Badge>}
                  {bal < 0 && <Badge bg="var(--good-bg)" fg="#4B6350">{kind === "suppliers" ? "لنا" : "له"} {fmt(-bal)}</Badge>}
                  {bal === 0 && <Badge bg="var(--divider)" fg="var(--text-muted)">لا يوجد رصيد</Badge>}
                </div>
              </button>
            );
          })}
        </div>
      )}
      {showAdd && <Modal title={`إضافة ${label.replace(/ون$|اء$/, "")}`} onClose={() => setShowAdd(false)}><AddContactForm existing={data} onAdd={(c) => { upsert(collection, c); setShowAdd(false); }} /></Modal>}
      {open && <ContactDetail contact={open} label={label} icon={icon} invoices={invoices} onClose={() => setOpenId(null)} onSave={(c) => upsert(collection, c)} onDelete={() => { remove(collection, open.id); setOpenId(null); }} relatedProjects={relatedProjects} income={income} onOpenProject={onOpenProject} existing={data.filter((d) => d.id !== open.id)} />}
    </div>
  );
}

function AddContactForm({ onAdd, existing = [] }) {
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [notes, setNotes] = useState("");
  const submit = () => {
    if (!name.trim()) return;
    if (hasDuplicateName(existing, name)) { notify("هذا الاسم مسجل مسبقًا."); return; }
    onAdd({ id: uid(), name: name.trim(), phone: phone.trim(), notes: notes.trim(), transactions: [] });
  };
  return (
    <div className="flex flex-col gap-3">
      <div><FieldLabel>الاسم</FieldLabel><TextInput value={name} onChange={(e) => setName(e.target.value)} /></div>
      <div><FieldLabel>رقم الهاتف (اختياري)</FieldLabel><TextInput value={phone} onChange={(e) => setPhone(e.target.value)} /></div>
      <div><FieldLabel>ملاحظات (اختياري)</FieldLabel><TextInput value={notes} onChange={(e) => setNotes(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!name.trim()}><Icon name="plus" size={16} /> إضافة</PrimaryButton>
    </div>
  );
}

function ContactDetail({ contact, label, icon, invoices = [], onClose, onSave, onDelete, relatedProjects, income = [], onOpenProject, existing = [] }) {
  const [local, setLocal] = useState(contact);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [txType, setTxType] = useState("debit");
  const [txAmount, setTxAmount] = useState("");
  const [txNote, setTxNote] = useState("");
  const [pendingTxDelete, setPendingTxDelete] = useState(null);
  const [supplierPaymentAmount, setSupplierPaymentAmount] = useState("");
  const [supplierPaymentDate, setSupplierPaymentDate] = useState(todayISO());
  const [supplierPaymentNote, setSupplierPaymentNote] = useState("");
  useEffect(() => setLocal(contact), [contact.id]);
  const update = (patch) => { const next = { ...local, ...patch }; setLocal(next); onSave(next); };
  const balance = contactBalance(local);
  const transactions = local.transactions || [];
  const supplierStatement = label === "موردون" ? getSupplierStatement(local, invoices) : null;
  const isDuplicateName = hasDuplicateName(existing, local.name);
  const projectTotals = (relatedProjects || []).reduce((summary, project) => {
    const sm = getProjectSummary(project, income);
    return { cost: summary.cost + sm.cost, paid: summary.paid + sm.paid, remaining: summary.remaining + sm.remaining, surplus: summary.surplus + sm.surplus };
  }, { cost: 0, paid: 0, remaining: 0, surplus: 0 });
  const projectRemaining = projectTotals.remaining;
  const directPayments = relatedProjects != null ? getCustomerDirectPayments(local, income) : [];
  const directTotal = directPayments.reduce((sum, entry) => sum + Number(entry.amount || 0), 0);
  const grandTotal = balance + projectRemaining - projectTotals.surplus - directTotal;

  const addTx = () => {
    if (!positiveNumber(txAmount) || Number(txAmount) < 0) { notify("مبلغ الحركة يجب أن يكون موجبًا."); return; }
    const tx = { id: uid(), date: todayISO(), type: txType, amount: Number(txAmount), note: txNote.trim() };
    update({ transactions: [tx, ...transactions] });
    setTxAmount(""); setTxNote("");
  };
  const removeTx = (id) => { update({ transactions: transactions.filter((t) => t.id !== id) }); setPendingTxDelete(null); };
  const addSupplierPayment = () => {
    if (!positiveNumber(supplierPaymentAmount)) { notify("أدخل مبلغ سداد موجبًا."); return; }
    const amount = Number(supplierPaymentAmount);
    const payment = { id: uid(), date: supplierPaymentDate || todayISO(), type: "credit", amount, note: supplierPaymentNote.trim() || "سداد عام للمورد", supplierPayment: true, allocations: allocateSupplierPayment(local, invoices, amount) };
    update({ transactions: [payment, ...transactions] });
    setSupplierPaymentAmount(""); setSupplierPaymentNote(""); setSupplierPaymentDate(todayISO());
    notify(payment.allocations.length ? "تم تسجيل السداد وتوزيعه على أقدم الفواتير." : "تم تسجيل السداد كرصيد لنا عند المورد.", "success");
  };

  return (
    <Modal title={local.name} onClose={onClose} wide>
      <div className="flex flex-col gap-4">
        <div className="grid sm:grid-cols-2 gap-3">
          <div><FieldLabel>الاسم</FieldLabel><TextInput value={local.name} onChange={(e) => update({ name: e.target.value })} />{isDuplicateName && <div className="text-xs mt-1" style={{ color: "#A34632" }}>يوجد اسم مطابق مسجّل مسبقًا — تأكد أنه ليس تكرارًا لنفس الجهة.</div>}</div>
          <div><FieldLabel>رقم الهاتف</FieldLabel><TextInput value={local.phone} onChange={(e) => update({ phone: e.target.value })} /></div>
        </div>
        <div><FieldLabel>ملاحظات</FieldLabel><TextInput value={local.notes} onChange={(e) => update({ notes: e.target.value })} /></div>

        {(relatedProjects != null || label === "موردون") && (
          <button type="button" onClick={() => printAccountStatement(label === "موردون" ? "supplier" : "customer", local, { invoices, projects: relatedProjects || [], income })} className="w-full rounded-lg border px-4 py-2.5 text-sm font-medium flex items-center justify-center gap-2" style={{ borderColor: "var(--accent)", color: "var(--accent)", background: "var(--card-bg)" }}>
            <Icon name="receipt" size={16} /> كشف حساب
          </button>
        )}

        <div className="rounded-xl p-3 flex items-center justify-between" style={{ background: balance > 0 ? "var(--warn-bg)" : balance < 0 ? "var(--good-bg)" : "var(--divider)" }}>
          <span className="text-sm" style={{ color: "var(--text-body)" }}>{label === "موردون" ? "الرصيد اليدوي للمورد" : "الرصيد اليدوي للعميل"}</span>
          <span className="font-bold text-lg" style={{ color: balance > 0 ? "#A34632" : balance < 0 ? "#4B6350" : "var(--text-strong)" }}>
            {balance === 0 ? "لا يوجد" : balance > 0 ? (label === "موردون" ? `علينا ${fmt(balance)}` : `عليه ${fmt(balance)}`) : (label === "موردون" ? `لنا ${fmt(-balance)}` : `له ${fmt(-balance)}`)}
          </span>
        </div>

        {label === "موردون" && supplierStatement && (
          <div className="rounded-xl border p-3 flex flex-col gap-3" style={{ borderColor: "var(--card-border)" }}>
            <FieldLabel>الحساب العام للمورد</FieldLabel>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
              <div className="rounded-lg p-2" style={{ background: "var(--divider)" }}><div style={{ color: "var(--text-muted)" }}>إجمالي الفواتير الآجلة</div><strong style={{ color: "var(--text-strong)" }}>{fmt(supplierStatement.totalInvoices)}</strong></div>
              <div className="rounded-lg p-2" style={{ background: "var(--good-bg)" }}><div style={{ color: "var(--text-muted)" }}>المدفوع</div><strong style={{ color: "#4B6350" }}>{fmt(supplierStatement.invoicePaid)}</strong></div>
              <div className="rounded-lg p-2" style={{ background: supplierStatement.owed ? "var(--warn-bg)" : "var(--good-bg)" }}><div style={{ color: "var(--text-muted)" }}>مستحق علينا</div><strong style={{ color: supplierStatement.owed ? "#A34632" : "#4B6350" }}>{fmt(supplierStatement.owed)}</strong></div>
              <div className="rounded-lg p-2" style={{ background: supplierStatement.credit ? "var(--good-bg)" : "var(--divider)" }}><div style={{ color: "var(--text-muted)" }}>مستحق لنا</div><strong style={{ color: "#4B6350" }}>{fmt(supplierStatement.credit)}</strong></div>
            </div>
            <div className="rounded-lg border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
              <div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>تسجيل سداد عام</div>
              <div className="grid grid-cols-2 gap-2"><TextInput type="number" placeholder="مبلغ السداد" value={supplierPaymentAmount} onChange={(e) => setSupplierPaymentAmount(e.target.value)} /><TextInput type="date" value={supplierPaymentDate} onChange={(e) => setSupplierPaymentDate(e.target.value)} /></div>
              <TextInput placeholder="ملاحظة (اختياري)" value={supplierPaymentNote} onChange={(e) => setSupplierPaymentNote(e.target.value)} />
              <div className="text-xs" style={{ color: "var(--text-muted)" }}>يوزّع السداد تلقائيًا على أقدم الفواتير غير المسددة، وأي زيادة تصبح رصيدًا لنا عند المورد.</div>
              <PrimaryButton onClick={addSupplierPayment} full disabled={!supplierPaymentAmount}><Icon name="plus" size={16} /> تسجيل السداد</PrimaryButton>
            </div>
            <div className="flex flex-col gap-1">
              <div className="text-xs font-medium" style={{ color: "var(--text-muted)" }}>الفواتير الآجلة</div>
              {supplierStatement.rows.length === 0 ? <div className="text-xs" style={{ color: "var(--text-muted)" }}>لا توجد فواتير آجلة لهذا المورد.</div> : supplierStatement.rows.map((row) => <div key={row.invoice.id} className="flex items-center justify-between text-xs py-1.5 border-b" style={{ borderColor: "var(--divider)" }}><span>#{row.invoice.invoiceNumber || row.invoice.id} · {row.invoice.date}</span><span style={{ color: row.remaining ? "#A34632" : "#4B6350" }}>{row.remaining ? `متبقي ${fmt(row.remaining)}` : "مسددة"}</span></div>)}
            </div>
          </div>
        )}

        {relatedProjects != null && (
          <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
            <FieldLabel>مشاريع هذا العميل ({relatedProjects.length})</FieldLabel>
            <div className="rounded-lg p-3 flex items-center justify-between" style={{ background: grandTotal > 0 ? "var(--warn-bg)" : "var(--good-bg)" }}>
              <span className="text-sm" style={{ color: "var(--text-body)" }}>الإجمالي الكلي المستحق (الرصيد + باقي المشاريع − الدفعات المباشرة)</span>
              <span className="font-bold text-lg" style={{ color: grandTotal > 0 ? "#A34632" : "#4B6350" }}>{grandTotal > 0 ? fmt(grandTotal) : grandTotal < 0 ? "رصيد للعميل " + fmt(-grandTotal) : "لا يوجد"}</span>
            </div>
            <div className="text-xs" style={{ color: "var(--text-muted)" }}>الرصيد اليدوي أعلاه لا يشمل دفعات المشاريع، وتُحتسب دفعات المشاريع في الملخص أدناه بشكل منفصل.</div>
            <div className="grid grid-cols-3 gap-2 text-xs">
              <div className="rounded-lg p-2" style={{ background: "var(--divider)" }}><div style={{ color: "var(--text-muted)" }}>تكلفة المشاريع</div><strong style={{ color: "var(--text-strong)" }}>{fmt(projectTotals.cost)}</strong></div>
              <div className="rounded-lg p-2" style={{ background: "var(--good-bg)" }}><div style={{ color: "var(--text-muted)" }}>مجموع الواصل</div><strong style={{ color: "#4B6350" }}>{fmt(projectTotals.paid)}</strong></div>
              <div className="rounded-lg p-2" style={{ background: projectRemaining ? "var(--warn-bg)" : "var(--good-bg)" }}><div style={{ color: "var(--text-muted)" }}>{projectRemaining ? "الباقي العام" : "الحالة"}</div><strong style={{ color: projectRemaining ? "#A34632" : "#4B6350" }}>{projectRemaining ? fmt(projectRemaining) : "خالص"}</strong></div>
            </div>
            {projectTotals.surplus > 0 && <div className="text-xs" style={{ color: "#4B6350" }}>زيادة مدفوعة في مشاريع مكتملة (رصيد للعميل): {fmt(projectTotals.surplus)}</div>}
            {directPayments.length > 0 && (
              <div className="rounded-lg p-2 text-xs flex flex-col gap-1" style={{ background: "var(--good-bg)" }}>
                <div className="font-medium" style={{ color: "#4B6350" }}>دفعات مباشرة بدون مشروع: {fmt(directTotal)}</div>
                {directPayments.map((entry) => <div key={entry.id} className="flex items-center justify-between" style={{ color: "var(--text-body)" }}><span>{entry.date}{entry.description ? " · " + entry.description : ""}</span><span>{fmt(entry.amount)}</span></div>)}
              </div>
            )}
            {relatedProjects.length === 0 ? (
              <div className="text-xs" style={{ color: "var(--text-muted)" }}>لا توجد مشاريع مرتبطة بهذا العميل بعد</div>
            ) : (
              <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
                {relatedProjects.map((p) => {
                  const m = getProjectSummary(p, income);
                  const total = m.cost;
                  return (
                    <button key={p.id} onClick={() => { onOpenProject(p.id); onClose(); }} className="flex items-center justify-between py-2 text-right" style={{ borderColor: "var(--divider)" }}>
                      <div><div className="text-sm" style={{ color: "var(--text-body)" }}>{p.location || "بدون موقع"}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{p.dateCreated} · {p.productType}</div></div>
                      <div className="flex items-center gap-2">
                        <Badge bg={STATUS_COLOR[p.status].bg} fg={STATUS_COLOR[p.status].fg}>{p.status}</Badge>
                        <span className="text-xs" style={{ color: m.remaining ? "#A34632" : "#4B6350" }}>{m.remaining ? `باقي ${fmt(m.remaining)}` : m.surplus ? `رصيد ${fmt(m.surplus)}` : m.settled ? "خالص" : "بانتظار الكيل"}</span>
                        <span className="text-sm font-medium" style={{ color: "var(--text-strong)" }}>{fmt(total)}</span>
                      </div>
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        )}

        <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
          <FieldLabel>{label === "موردون" ? "حركة يدوية (غير مرتبطة بفاتورة)" : "تسجيل حركة جديدة"}</FieldLabel>
          <div className="grid grid-cols-2 gap-2">
            <Select value={txType} onChange={(e) => setTxType(e.target.value)}><option value="debit">{label === "موردون" ? "زيادة مستحق علينا" : "زيادة دين عليه"}</option><option value="credit">{label === "موردون" ? "رصيد لنا / تسوية" : "تسديد / دفعة منه"}</option></Select>
            <TextInput type="number" placeholder="المبلغ" value={txAmount} onChange={(e) => setTxAmount(e.target.value)} />
          </div>
          <TextInput placeholder="ملاحظة (اختياري)" value={txNote} onChange={(e) => setTxNote(e.target.value)} />
          <PrimaryButton onClick={addTx} full disabled={!txAmount}><Icon name="plus" size={16} /> تسجيل الحركة</PrimaryButton>
        </div>

        {transactions.length === 0 ? <EmptyState icon={icon} title="لا توجد حركات مسجّلة بعد" /> : (
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {transactions.map((t) => (
              <div key={t.id} className="flex items-center justify-between py-2.5" style={{ borderColor: "var(--divider)" }}>
                <div className="flex items-center gap-2">
                  <Icon name={t.type === "debit" ? "trendUp" : "trendDown"} size={14} color={t.type === "debit" ? "#A34632" : "#4B6350"} />
                  <div><div className="text-sm" style={{ color: "var(--text-body)" }}>{t.note || (t.type === "debit" ? "زيادة دين" : "تسديد")}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{t.date}</div></div>
                </div>
                <div className="flex items-center gap-3">
                  <span className="font-medium" style={{ color: t.type === "debit" ? "#A34632" : "#4B6350" }}>{t.type === "debit" ? "+" : "−"}{fmt(t.amount)}</span>
                  {pendingTxDelete === t.id ? <ConfirmInline onConfirm={() => removeTx(t.id)} onCancel={() => setPendingTxDelete(null)} /> : <button onClick={() => setPendingTxDelete(t.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={13} /></button>}
                </div>
              </div>
            ))}
          </div>
        )}

        <div className="pt-3 border-t flex justify-end" style={{ borderColor: "var(--card-border)" }}>
          {confirmDelete ? <ConfirmInline label="حذف نهائيًا؟" onConfirm={onDelete} onCancel={() => setConfirmDelete(false)} /> : <button onClick={() => setConfirmDelete(true)} className="text-xs flex items-center gap-1" style={{ color: "#A34632" }}><Icon name="trash" size={13} /> حذف</button>}
        </div>
      </div>
    </Modal>
  );
}

// ---------- Attendance ----------
function AttendanceTab({ workers, attendance, upsert, remove }) {
  const [date, setDate] = useState(todayISO());
  const dayRecords = attendance.filter((a) => a.date === date);
  const getStatus = (workerId) => dayRecords.find((a) => a.workerId === workerId)?.status;
  const setStatus = (worker, status) => upsert("attendance", { id: worker.id + "_" + date, workerId: worker.id, workerName: worker.name, date, status });

  const month = monthKey(date);
  const monthRecords = attendance.filter((a) => monthKey(a.date) === month);
  const summary = workers.map((w) => ({
    name: w.name,
    present: monthRecords.filter((a) => a.workerId === w.id && a.status === "حاضر").length,
    half: monthRecords.filter((a) => a.workerId === w.id && a.status === "نصف يوم").length,
    absent: monthRecords.filter((a) => a.workerId === w.id && a.status === "غائب").length,
  }));

  return (
    <div className="flex flex-col gap-5">
      <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>حضور العمال</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>تسجيل الحضور اليومي ومتابعة الملخص الشهري</p></div>

      <div className="flex items-center gap-2"><FieldLabel>التاريخ</FieldLabel></div>
      <TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} className="max-w-[200px]" />

      {workers.length === 0 ? (
        <EmptyState icon="users" title="لا يوجد عمال مسجّلون بعد" sub="أضف العمال من قسم «الحسابات والديون» ثم عد هنا لتسجيل حضورهم" />
      ) : (
        <div className="rounded-2xl border overflow-hidden" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {workers.map((w) => {
              const st = getStatus(w.id);
              return (
                <div key={w.id} className="flex items-center justify-between px-4 py-3 gap-2 flex-wrap" style={{ borderColor: "var(--divider)" }}>
                  <div className="text-sm font-medium flex items-center gap-1.5" style={{ color: "var(--text-strong)" }}><Icon name="user" size={14} /> {w.name}</div>
                  <div className="flex gap-1.5">
                    {ATTENDANCE_STATUSES.map((s) => (
                      <button key={s} onClick={() => setStatus(w, s)} className="text-xs px-3 py-1.5 rounded-lg border transition" style={st === s ? { background: ATT_COLOR[s].bg, borderColor: ATT_COLOR[s].fg, color: ATT_COLOR[s].fg } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-muted)" }}>{s}</button>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {workers.length > 0 && (
        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>ملخص شهر {month}</h3>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            <div className="flex items-center justify-between py-2 text-xs font-medium" style={{ color: "var(--text-muted)" }}><span>العامل</span><span>حاضر / نصف يوم / غائب</span></div>
            {summary.map((s) => (
              <div key={s.name} className="flex items-center justify-between py-2 text-sm" style={{ color: "var(--text-body)", borderColor: "var(--divider)" }}>
                <span>{s.name}</span>
                <span className="flex items-center gap-2">
                  <Badge bg="var(--good-bg)" fg="#4B6350">{s.present}</Badge>
                  <Badge bg="var(--warn-bg)" fg="#8A6A32">{s.half}</Badge>
                  <Badge bg="var(--divider)" fg="var(--text-muted)">{s.absent}</Badge>
                </span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Reports ----------
function ReportsTab({ month, setMonth, projects, invoices, expenses, income, attendance, workers, customers, suppliers, downloadsNs }) {
  const inMonth = (arr, field) => arr.filter((x) => monthKey(x[field || "date"]) === month);
  const allIncome = getAllProjectIncome(projects, income);
  const mIncome = inMonth(allIncome);
  const mExpenses = inMonth(expenses);
  const mInvoices = inMonth(invoices);
  const totalIncome = mIncome.reduce((s, x) => s + Number(x.amount || 0), 0);
  const totalExpenses = mExpenses.reduce((s, x) => s + Number(x.amount || 0), 0);
  const totalInvoices = mInvoices.reduce((s, x) => s + Number(x.amount || 0), 0);
  const paidInvoices = getPaidInvoicesTotal(invoices, suppliers, month);
  const net = totalIncome - totalExpenses - paidInvoices;

  const completedProjects = projects.filter((p) => p.completedAt && monthKey(p.completedAt) === month);
  const newProjects = projects.filter((p) => monthKey(p.dateCreated) === month);

  const expenseByType = EXPENSE_TYPES.map((t) => ({ label: t, total: mExpenses.filter((e) => e.type === t).reduce((s, e) => s + Number(e.amount || 0), 0) })).filter((r) => r.total > 0);
  const invoiceByType = INVOICE_TYPES.map((t) => ({ label: t, total: mInvoices.filter((i) => i.type === t).reduce((s, i) => s + Number(i.amount || 0), 0) })).filter((r) => r.total > 0);

  const monthAttendance = attendance.filter((a) => monthKey(a.date) === month);
  const attSummary = workers.map((w) => ({
    name: w.name,
    present: monthAttendance.filter((a) => a.workerId === w.id && a.status === "حاضر").length,
    half: monthAttendance.filter((a) => a.workerId === w.id && a.status === "نصف يوم").length,
    absent: monthAttendance.filter((a) => a.workerId === w.id && a.status === "غائب").length,
  })).filter((s) => s.present + s.half + s.absent > 0);

  const customerDebts = customers
    .map((c) => { const o = getCustomerOutstanding(c, projects, income); return { name: c.name, phone: c.phone, ledger: o.ledger, projectsRemaining: o.projectsRemaining, projectsSurplus: o.projectsSurplus, directPaid: o.directPaid, total: o.total }; })
    .filter((c) => c.total > 0)
    .sort((a, b) => b.total - a.total);
  const supplierDebts = suppliers
    .map((s) => { const statement = getSupplierStatement(s, invoices); return { name: s.name, phone: s.phone, total: statement.owed, credit: statement.credit }; })
    .filter((s) => s.total > 0)
    .sort((a, b) => b.total - a.total);
  const totalCustomerDebt = customerDebts.reduce((s, c) => s + c.total, 0);
  const totalSupplierDebt = supplierDebts.reduce((s, c) => s + c.total, 0);
  const totalSupplierCredit = suppliers.reduce((sum, supplier) => sum + getSupplierStatement(supplier, invoices).credit, 0);

  const exportMonth = async () => {
    if (!window.XLSX) { notify("ميزة التصدير غير متاحة هنا حاليًا."); return; }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ الشهر: month, الواردات: totalIncome, المصاريف: totalExpenses, الفواتير: totalInvoices, "الفواتير المدفوعة": paidInvoices, الصافي: net }]), "ملخص");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mIncome.map((x) => ({ الزبون: x.customerName, المشروع: projects.find((p) => p.id === x.projectId)?.customerName || "", "معرف المشروع": x.projectId || "", المبلغ: x.amount, التاريخ: x.date, الوصف: x.description }))), "الواردات");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mExpenses.map((x) => ({ النوع: x.type, المبلغ: x.amount, التاريخ: x.date }))), "المصاريف");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mInvoices.map((x) => ({ النوع: x.type, المورد: x.supplierName, المبلغ: x.amount, التاريخ: x.date }))), "الفواتير");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(completedProjects.map((p) => ({ الزبون: p.customerName, الموقع: p.location, الحالة: p.status, "تاريخ المشروع": p.dateCreated, "تاريخ الإكمال": p.completedAt, الإجمالي: projectCost(p) }))), "مشاريع مكتملة");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Array.from(new Map(projects.flatMap((project) => getProjectPayments(project, income).filter((payment) => monthKey(payment.date) === month).map((payment) => [payment.paymentId || payment.id, { الزبون: project.customerName, "معرف المشروع": project.id, "تاريخ الدفعة": payment.date, المبلغ: payment.amount, "وصف الدفعة": payment.description || "" }]))).values())), "دفعات المشاريع");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(workers.map((w) => { const records = monthAttendance.filter((a) => a.workerId === w.id); return { العامل: w.name, حاضر: records.filter((a) => a.status === "حاضر").length, "نصف يوم": records.filter((a) => a.status === "نصف يوم").length, غائب: records.filter((a) => a.status === "غائب").length }; })), "حضور العمال");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(customerDebts.length ? customerDebts.map((c) => ({ العميل: c.name, الهاتف: c.phone || "", "رصيد يدوي": c.ledger, "باقي مشاريع": c.projectsRemaining, "رصيد فائض المشاريع": c.projectsSurplus || 0, "دفعات مباشرة": c.directPaid || 0, "الإجمالي المستحق": c.total })) : [{ "لا توجد مستحقات": "" }]), "مستحقات العملاء");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(supplierDebts.length ? supplierDebts.map((s) => ({ المورد: s.name, الهاتف: s.phone || "", "المبلغ المستحق": s.total })) : [{ "لا توجد مستحقات": "" }]), "مستحقات للموردين");
    const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const filename = `تقرير-${month}.xlsx`;
    if (downloadsNs) { try { await downloadsNs.save({ filename, data: blob }); } catch (e) { console.error(e); } }
    else downloadBlob(blob, filename);
  };

  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>التقارير الشهرية</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>ملخص شامل لأي شهر تختاره — صافي الحركة النقدية = الواردات − المصاريف − الفواتير المدفوعة (النقدية + سداد الموردين)</p></div>
        <div className="flex items-center gap-2">
          <TextInput type="month" value={month} onChange={(e) => setMonth(e.target.value)} className="max-w-[170px]" />
          <PrimaryButton onClick={exportMonth}><Icon name="download" size={16} /> تصدير التقرير</PrimaryButton>
        </div>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard icon="trendUp" label="واردات الشهر" value={fmt(totalIncome)} accent="#4B6350" />
        <StatCard icon="trendDown" label="مصاريف الشهر" value={fmt(totalExpenses)} accent="#A34632" />
        <StatCard icon="receipt" label="فواتير الشهر" value={fmt(totalInvoices)} sub={"المدفوع فعليًا: " + fmt(paidInvoices)} accent="#8A6A32" />
        <StatCard icon={net >= 0 ? "trendUp" : "trendDown"} label="صافي الحركة النقدية" value={fmt(net)} accent={net >= 0 ? "#4B6350" : "#A34632"} />
      </div>

      <div>
        <h2 className="text-sm font-semibold mb-3" style={{ color: "var(--text-body)" }}>المستحقات حتى اليوم — عملاء وموردون</h2>
        <div className="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-3">
          <StatCard icon="users" label="إجمالي مستحق على العملاء (لنا)" value={fmt(totalCustomerDebt)} sub={customerDebts.length + " عميل مدين"} accent="#A6673B" />
          <StatCard icon="briefcase" label="إجمالي مستحق للموردين (علينا)" value={fmt(totalSupplierDebt)} sub={supplierDebts.length + " مورّد له مستحقات"} accent="#5C4A38" />
          <StatCard icon="wallet" label="إجمالي مستحق لنا من الموردين" value={fmt(totalSupplierCredit)} sub="دفعات زائدة أو أرصدة دائنة" accent="#4B6350" />
        </div>
        <div className="grid lg:grid-cols-2 gap-4">
          <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
            <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>تفصيل مستحقات العملاء</h3>
            {customerDebts.length === 0 ? <EmptyState icon="users" title="لا توجد مستحقات على العملاء حاليًا" /> : (
              <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
                {customerDebts.map((c) => (
                  <div key={c.name} className="flex items-center justify-between py-2 text-sm" style={{ borderColor: "var(--divider)" }}>
                    <div>
                      <div style={{ color: "var(--text-body)" }}>{c.name}</div>
                      {c.phone && <div className="text-xs" style={{ color: "var(--text-muted)" }}>{c.phone}</div>}
                    </div>
                    <span className="font-semibold" style={{ color: "#A34632" }}>{fmt(c.total)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
          <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
            <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>تفصيل مستحقات الموردين</h3>
            {supplierDebts.length === 0 ? <EmptyState icon="briefcase" title="لا توجد مستحقات للموردين حاليًا" /> : (
              <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
                {supplierDebts.map((s) => (
                  <div key={s.name} className="flex items-center justify-between py-2 text-sm" style={{ borderColor: "var(--divider)" }}>
                    <div>
                      <div style={{ color: "var(--text-body)" }}>{s.name}</div>
                      {s.phone && <div className="text-xs" style={{ color: "var(--text-muted)" }}>{s.phone}</div>}
                    </div>
                    <span className="font-semibold" style={{ color: "#A34632" }}>{fmt(s.total)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
        <div className="text-xs mt-2" style={{ color: "var(--text-muted)" }}>مستحقات العملاء تشمل الرصيد اليدوي + باقي كل مشاريعهم غير المسددة بالكامل. هذه الأرقام لحظية (حتى اليوم) وليست خاصة بالشهر المختار فقط.</div>
      </div>

      <div className="grid lg:grid-cols-2 gap-4">
        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>المصاريف حسب النوع</h3>
          {expenseByType.length === 0 ? <EmptyState icon="wallet" title="لا توجد مصاريف هذا الشهر" /> : <BarBreakdown rows={expenseByType} />}
        </div>
        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>الفواتير حسب النوع</h3>
          {invoiceByType.length === 0 ? <EmptyState icon="receipt" title="لا توجد فواتير هذا الشهر" /> : <BarBreakdown rows={invoiceByType} />}
        </div>
      </div>

      <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
        <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>مشاريع اكتملت هذا الشهر ({completedProjects.length})</h3>
        {completedProjects.length === 0 ? <EmptyState icon="factory" title="لا توجد مشاريع مكتملة هذا الشهر" /> : (
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {completedProjects.map((p) => (
              <div key={p.id} className="flex items-center justify-between py-2.5" style={{ borderColor: "var(--divider)" }}>
                <div><div className="text-sm" style={{ color: "var(--text-body)" }}>{p.customerName}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{p.location}</div></div>
                <span className="font-semibold" style={{ color: "var(--text-strong)" }}>{fmt((p.measurements || []).reduce((s, m) => s + Number(m.totalAmount || 0), 0))}</span>
              </div>
            ))}
          </div>
        )}
        <div className="text-xs mt-3" style={{ color: "var(--text-muted)" }}>مشاريع جديدة بدأت هذا الشهر: {newProjects.length}</div>
      </div>

      {attSummary.length > 0 && (
        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>أيام حضور العمال هذا الشهر</h3>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {attSummary.map((s) => <div key={s.name} className="flex items-center justify-between py-2 text-sm" style={{ color: "var(--text-body)", borderColor: "var(--divider)" }}><span>{s.name}</span><span className="flex items-center gap-2"><Badge bg="var(--good-bg)" fg="#4B6350">حاضر {s.present}</Badge><Badge bg="var(--warn-bg)" fg="#8A6A32">نصف يوم {s.half}</Badge><Badge bg="var(--divider)" fg="var(--text-muted)">غائب {s.absent}</Badge></span></div>)}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Personal log ----------
function PersonalLogTab({ data, upsert, remove }) {
  const [showAdd, setShowAdd] = useState(false);
  const [pendingDelete, setPendingDelete] = useState(null);
  const sorted = [...data].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const totalIn = data.filter((x) => x.type === "واصل").reduce((s, x) => s + Number(x.amount || 0), 0);
  const totalOut = data.filter((x) => x.type === "مصروف").reduce((s, x) => s + Number(x.amount || 0), 0);
  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>سجلي الشخصي</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>ما وصلك من مبالغ وما صرفته — سجل خاص بك</p></div>
        <PrimaryButton onClick={() => setShowAdd(true)}><Icon name="plus" size={16} /> تسجيل حركة</PrimaryButton>
      </div>
      <div className="grid grid-cols-3 gap-3">
        <StatCard icon="trendUp" label="إجمالي الواصل" value={fmt(totalIn)} accent="#4B6350" />
        <StatCard icon="trendDown" label="إجمالي المصروف" value={fmt(totalOut)} accent="#A34632" />
        <StatCard icon="wallet" label="المتبقي بيدي" value={fmt(totalIn - totalOut)} accent="#8A6A32" />
      </div>
      {sorted.length === 0 ? <EmptyState icon="wallet" title="لا توجد حركات مسجّلة بعد" /> : (
        <div className="rounded-2xl border overflow-hidden" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {sorted.map((x) => (
              <div key={x.id} className="flex items-center justify-between px-4 py-3 gap-2" style={{ borderColor: "var(--divider)" }}>
                <div className="min-w-0"><div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>{x.type}</div><div className="text-xs mt-0.5" style={{ color: "var(--text-muted)" }}>{x.date} {x.description ? "· " + x.description : ""}</div></div>
                <div className="flex items-center gap-3 shrink-0">
                  <span className="font-semibold" style={{ color: x.type === "واصل" ? "#4B6350" : "#A34632" }}>{x.type === "واصل" ? "+" : "−"}{fmt(x.amount)}</span>
                  {pendingDelete === x.id ? <ConfirmInline onConfirm={() => { remove("personalLog", x.id); setPendingDelete(null); }} onCancel={() => setPendingDelete(null)} /> : <button onClick={() => setPendingDelete(x.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button>}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
      {showAdd && <Modal title="تسجيل حركة" onClose={() => setShowAdd(false)}><AddPersonalForm onAdd={(e) => { upsert("personalLog", e); setShowAdd(false); }} /></Modal>}
    </div>
  );
}
function AddPersonalForm({ onAdd }) {
  const [type, setType] = useState("واصل");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayISO());
  const [description, setDescription] = useState("");
  const submit = () => { if (!positiveNumber(amount) || Number(amount) < 0) { notify("المبلغ يجب أن يكون موجبًا."); return; } onAdd({ id: uid(), type, amount: Number(amount), date, description: description.trim() }); };
  return (
    <div className="flex flex-col gap-3">
      <div><FieldLabel>النوع</FieldLabel><Select value={type} onChange={(e) => setType(e.target.value)}><option value="واصل">واصل (مبلغ استلمته)</option><option value="مصروف">مصروف (صرفته)</option></Select></div>
      <div className="grid grid-cols-2 gap-3"><div><FieldLabel>المبلغ</FieldLabel><TextInput type="number" value={amount} onChange={(e) => setAmount(e.target.value)} /></div><div><FieldLabel>التاريخ</FieldLabel><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div></div>
      <div><FieldLabel>وصف (اختياري)</FieldLabel><TextInput value={description} onChange={(e) => setDescription(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!amount}><Icon name="plus" size={16} /> حفظ</PrimaryButton>
    </div>
  );
}

// ---------- Inventory ----------
function InventoryTab({ inventory, upsert, remove }) {
  const [showAdd, setShowAdd] = useState(false);
  const [pendingDelete, setPendingDelete] = useState(null);
  const adjust = (item, delta) => {
    const current = Number(item.quantity);
    if (!Number.isFinite(current)) return;
    upsert("inventory", { ...item, quantity: Math.max(0, current + delta) });
  };
  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>المخزون</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>بضاعة مخزّنة في المكتب ومتابعة نقصها</p></div>
        <PrimaryButton onClick={() => setShowAdd(true)}><Icon name="plus" size={16} /> مادة جديدة</PrimaryButton>
      </div>
      {inventory.length === 0 ? <EmptyState icon="package" title="لا توجد مواد مسجّلة في المخزون" /> : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {inventory.map((i) => {
            const low = Number(i.quantity) <= Number(i.minThreshold || 0);
            return (
              <div key={i.id} className="rounded-2xl border p-4 flex flex-col gap-3" style={{ borderColor: low ? "var(--warn-border)" : "var(--card-border)", background: low ? "var(--warn-bg)" : "var(--card-bg)" }}>
                <div className="flex items-start justify-between">
                  <div><div className="font-medium" style={{ color: "var(--text-strong)" }}>{i.name}</div>{low && <div className="text-xs flex items-center gap-1 mt-0.5" style={{ color: "#A34632" }}><Icon name="alert" size={11} /> منخفض</div>}</div>
                  {pendingDelete === i.id ? <ConfirmInline onConfirm={() => { remove("inventory", i.id); setPendingDelete(null); }} onCancel={() => setPendingDelete(null)} /> : <button onClick={() => setPendingDelete(i.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button>}
                </div>
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <button onClick={() => adjust(i, -1)} className="w-7 h-7 rounded-lg border flex items-center justify-center" style={{ borderColor: "var(--card-border)", color: "var(--text-body)" }}>−</button>
                    <span className="text-lg font-bold min-w-[50px] text-center" style={{ color: "var(--text-strong)" }}>{fmt(i.quantity)}</span>
                    <button onClick={() => adjust(i, 1)} className="w-7 h-7 rounded-lg border flex items-center justify-center" style={{ borderColor: "var(--card-border)", color: "var(--text-body)" }}>+</button>
                  </div>
                  <span className="text-xs" style={{ color: "var(--text-muted)" }}>{i.unit}</span>
                </div>
                <div className="text-xs" style={{ color: "var(--text-muted)" }}>الحد الأدنى: {fmt(i.minThreshold)} {i.unit}</div>
              </div>
            );
          })}
        </div>
      )}
      {showAdd && <Modal title="مادة جديدة في المخزون" onClose={() => setShowAdd(false)}><AddInventoryForm existing={inventory} onAdd={(item) => { upsert("inventory", item); setShowAdd(false); }} /></Modal>}
    </div>
  );
}
function AddInventoryForm({ onAdd, existing = [] }) {
  const [name, setName] = useState("");
  const [quantity, setQuantity] = useState("");
  const [unit, setUnit] = useState("كيس");
  const [minThreshold, setMinThreshold] = useState("");
  const submit = () => {
    if (!name.trim() || !nonNegativeNumber(quantity || 0) || !nonNegativeNumber(minThreshold || 0)) { notify("أدخل كميات غير سالبة."); return; }
    if (hasDuplicateName(existing, name)) { notify("هذه المادة موجودة مسبقًا."); return; }
    onAdd({ id: uid(), name: name.trim(), quantity: Number(quantity || 0), unit, minThreshold: Number(minThreshold || 0) });
  };
  return (
    <div className="flex flex-col gap-3">
      <div><FieldLabel>اسم المادة</FieldLabel><TextInput list="item-suggestions-2" value={name} onChange={(e) => setName(e.target.value)} /><datalist id="item-suggestions-2">{ITEM_SUGGESTIONS.map((s) => <option key={s} value={s} />)}</datalist></div>
      <div className="grid grid-cols-2 gap-3"><div><FieldLabel>الكمية الحالية</FieldLabel><TextInput type="number" value={quantity} onChange={(e) => setQuantity(e.target.value)} /></div><div><FieldLabel>الوحدة</FieldLabel><Select value={unit} onChange={(e) => setUnit(e.target.value)}><option>كيس</option><option>لتر</option><option>م</option><option>قطعة</option></Select></div></div>
      <div><FieldLabel>حد التنبيه عند النقص</FieldLabel><TextInput type="number" value={minThreshold} onChange={(e) => setMinThreshold(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!name.trim()}><Icon name="plus" size={16} /> إضافة إلى المخزون</PrimaryButton>
    </div>
  );
}

function App() {
  const auth = useAuth();
  if (!hasBackend) return <><ToastHost /><FactoryApp /></>;
  if (auth.loading) return <><ToastHost /><div dir="rtl" className="min-h-screen flex items-center justify-center text-sm" style={{ background: "var(--bg)", color: "var(--text-muted)", fontFamily: "'Cairo', sans-serif" }}>جارٍ التحقق من الحساب...</div></>;
  if (!auth.session) return <><ToastHost /><AuthScreen auth={auth} /></>;
  if (auth.error || !auth.organization) return <><ToastHost /><div dir="rtl" className="min-h-screen flex items-center justify-center p-4 text-sm" style={{ background: "var(--bg)", color: "#A34632", fontFamily: "'Cairo', sans-serif" }}>تعذر تجهيز مساحة الشركة: {auth.error || "لم يتم العثور على المنظمة"}</div></>;
  return <><ToastHost /><FactoryApp organizationId={auth.organization.organization_id || auth.organization.id} organizationCode={auth.organization.invite_code} email={auth.session.user.email} onSignOut={auth.signOut} /></>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
