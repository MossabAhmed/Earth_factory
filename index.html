// ---------- helpers ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmt = (n) => Number(n || 0).toLocaleString("en-US");
const positiveNumber = (value) => Number.isFinite(Number(value)) && Number(value) > 0;
const nonNegativeNumber = (value) => Number.isFinite(Number(value)) && Number(value) >= 0;
const monthKey = (iso) => (iso || "").slice(0, 7);
const normalizeName = (value) => String(value || "").trim().replace(/\s+/g, " ").toLocaleLowerCase("ar");
const hasDuplicateName = (items, name, currentId = null) => (items || []).some((item) => item.id !== currentId && normalizeName(item.name) === normalizeName(name));
const contactBalance = (c) => (c.transactions || []).reduce((s, t) => s + (t.type === "debit" ? Number(t.amount) : -Number(t.amount)), 0);
const getCustomerProjects = (customer, projects) => projects.filter((p) => p.customerId === customer.id || (!p.customerId && p.customerName === customer.name));
const getCustomerDirectPayments = (customer, income = []) => (income || [])
  .filter((entry) => !entry.projectId && Number(entry.amount) > 0 && (entry.customerId ? entry.customerId === customer.id : (entry.customerName && normalizeName(entry.customerName) === normalizeName(customer.name))))
  .sort((a, b) => (a.date || "").localeCompare(b.date || ""));
const getCustomerOutstanding = (customer, projects, income) => {
  const ledger = contactBalance(customer);
  const sums = getCustomerProjects(customer, projects).map((project) => getProjectSummary(project, income));
  const projectsRemaining = sums.reduce((sum, summary) => sum + summary.remaining, 0);
  const projectsSurplus = sums.reduce((sum, summary) => sum + summary.surplus, 0);
  const directPaid = getCustomerDirectPayments(customer, income).reduce((sum, entry) => sum + Number(entry.amount || 0), 0);
  return { ledger, projectsRemaining, projectsSurplus, directPaid, total: ledger + projectsRemaining - projectsSurplus - directPaid };
};
const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));
function numberToArabicWords(value) {
  const num = Math.round(Number(value) || 0);
  if (num === 0) return "صفر";
  if (num < 0) return "سالب " + numberToArabicWords(-num);

  const ones = ["", "واحد", "اثنان", "ثلاثة", "أربعة", "خمسة", "ستة", "سبعة", "ثمانية", "تسعة"];
  const teens = ["عشرة", "أحد عشر", "اثنا عشر", "ثلاثة عشر", "أربعة عشر", "خمسة عشر", "ستة عشر", "سبعة عشر", "ثمانية عشر", "تسعة عشر"];
  const tens = ["", "", "عشرون", "ثلاثون", "أربعون", "خمسون", "ستون", "سبعون", "ثمانون", "تسعون"];
  const hundreds = ["", "مائة", "مئتان", "ثلاثمائة", "أربعمائة", "خمسمائة", "ستمائة", "سبعمائة", "ثمانمائة", "تسعمائة"];

  const threeDigits = (n) => {
    const parts = [];
    const h = Math.floor(n / 100);
    const rem = n % 100;
    if (h > 0) parts.push(hundreds[h]);
    if (rem > 0) {
      if (rem < 10) parts.push(ones[rem]);
      else if (rem < 20) parts.push(teens[rem - 10]);
      else {
        const t = Math.floor(rem / 10);
        const o = rem % 10;
        parts.push(o > 0 ? ones[o] + " و" + tens[t] : tens[t]);
      }
    }
    return parts.join(" و");
  };

  const groups = [
    { value: 1000000000, singular: "مليار", dual: "ملياران", plural: "مليارات" },
    { value: 1000000, singular: "مليون", dual: "مليونان", plural: "ملايين" },
    { value: 1000, singular: "ألف", dual: "ألفان", plural: "آلاف" },
  ];

  let n = num;
  const resultParts = [];
  for (const group of groups) {
    const count = Math.floor(n / group.value);
    n = n % group.value;
    if (count > 0) {
      if (count === 1) resultParts.push(group.singular);
      else if (count === 2) resultParts.push(group.dual);
      else if (count <= 10) resultParts.push(threeDigits(count) + " " + group.plural);
      else resultParts.push(threeDigits(count) + " " + group.singular);
    }
  }
  if (n > 0) resultParts.push(threeDigits(n));
  return resultParts.join(" و");
}
const getProjectPayments = (project, income = []) => {
  const embeddedPayments = (project.payments || []).map((payment) => ({
    ...payment,
    paymentId: payment.paymentId || payment.id,
    projectId: project.id,
  }));
  const incomePayments = income
    .filter((entry) => entry.projectId === project.id)
    .map((entry) => ({ ...entry, paymentId: entry.paymentId || entry.id }));
  const unique = new Map();
  [...embeddedPayments, ...incomePayments].forEach((payment) => {
    const key = payment.paymentId || payment.id;
    if (key) unique.set(key, payment);
  });
  return Array.from(unique.values());
};
const projectCost = (project) => (project.measurements || []).reduce((sum, measurement) => sum + Number(measurement.totalAmount || 0), 0);
const getProjectSummary = (project, income = []) => {
  const cost = projectCost(project);
  const paid = getProjectPayments(project, income).reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
  const waived = Math.min(cost, Math.max(0, Number(project.waivedAmount || 0)));
  const completed = project.status === "مكتمل";
  const hasMeasure = (project.measurements || []).length > 0;
  const net = Math.round((cost - waived - paid) * 1000) / 1000;
  const extra = Math.max(0, -net);
  return { cost, paid, waived, completed, hasMeasure, remaining: Math.max(0, net), surplus: completed ? extra : 0, advance: completed ? 0 : extra, settled: completed && hasMeasure && net <= 0 };
};
const getUniqueIncome = (income = []) => {
  const unique = new Map();
  income.forEach((entry) => {
    const key = entry.projectId ? (entry.paymentId || entry.id) : entry.id;
    if (key) unique.set(key, entry);
  });
  return Array.from(unique.values());
};
const getAllProjectIncome = (projects = [], income = []) => {
  const unique = new Map();
  getUniqueIncome(income.filter((entry) => !entry.projectId)).forEach((entry) => unique.set(entry.id, entry));
  projects.forEach((project) => {
    getProjectPayments(project, income).forEach((payment) => {
      if (payment.includeInIncome === false) return;
      const key = payment.paymentId || payment.id;
      if (key) unique.set(key, { ...payment, customerName: payment.customerName || project.customerName, projectId: project.id });
    });
  });
  return Array.from(unique.values());
};
// الفواتير المدفوعة فعليًا في شهر: فواتير نقدية (غير آجلة) بتاريخ الفاتورة + دفعات سداد الموردين بتاريخ السداد
const getPaidInvoicesTotal = (invoices = [], suppliers = [], month) => {
  const supplierIds = new Set((suppliers || []).map((item) => item.id));
  const cashInvoices = (invoices || [])
    .filter((inv) => monthKey(inv.date) === month && !(inv.debtTransactionId && supplierIds.has(inv.supplierId)))
    .reduce((sum, inv) => sum + Number(inv.amount || 0), 0);
  const supplierPayments = (suppliers || [])
    .flatMap((item) => item.transactions || [])
    .filter((t) => t.supplierPayment && monthKey(t.date) === month)
    .reduce((sum, t) => sum + Math.max(0, Number(t.amount || 0)), 0);
  return cashInvoices + supplierPayments;
};
const upsertSupplierDebt = (supplier, transaction) => {
  const transactions = supplier.transactions || [];
  const exists = transactions.some((item) => item.id === transaction.id);
  return {
    ...supplier,
    transactions: exists ? transactions.map((item) => item.id === transaction.id ? { ...item, ...transaction } : item) : [transaction, ...transactions],
  };
};
const getSupplierDebtInvoices = (supplierId, invoices = []) => invoices
  .filter((invoice) => invoice.supplierId === supplierId && invoice.debtTransactionId && positiveNumber(invoice.amount))
  .sort((a, b) => (a.date || '').localeCompare(b.date || '') || String(a.id).localeCompare(String(b.id)));
const getSupplierStatement = (supplier, invoices = []) => {
  const debtInvoices = getSupplierDebtInvoices(supplier.id, invoices);
  const transactions = supplier.transactions || [];
  const paidByInvoice = new Map();
  let allocatedTotal = 0;
  transactions.filter((transaction) => transaction.supplierPayment && Array.isArray(transaction.allocations)).forEach((transaction) => {
    transaction.allocations.forEach((allocation) => {
      const amount = Math.max(0, Number(allocation.amount || 0));
      if (!amount || !debtInvoices.some((invoice) => invoice.id === allocation.invoiceId)) return;
      paidByInvoice.set(allocation.invoiceId, (paidByInvoice.get(allocation.invoiceId) || 0) + amount);
      allocatedTotal += amount;
    });
  });
  const rows = debtInvoices.map((invoice) => ({
    invoice,
    paid: Math.min(Number(invoice.amount || 0), paidByInvoice.get(invoice.id) || 0),
    remaining: Math.max(0, Number(invoice.amount || 0) - Math.min(Number(invoice.amount || 0), paidByInvoice.get(invoice.id) || 0)),
  }));
  const supplierPaymentTotal = transactions
    .filter((transaction) => transaction.supplierPayment)
    .reduce((sum, transaction) => sum + Math.max(0, Number(transaction.amount || 0)), 0);
  let unallocatedCredits = transactions
    .filter((transaction) => transaction.type === "credit" && !transaction.supplierPayment)
    .reduce((sum, transaction) => sum + Math.max(0, Number(transaction.amount || 0)), 0) + Math.max(0, supplierPaymentTotal - allocatedTotal);
  rows.forEach((row) => {
    const extra = Math.min(row.remaining, unallocatedCredits);
    row.paid += extra;
    row.remaining -= extra;
    unallocatedCredits -= extra;
  });
  const invoiceDebt = rows.reduce((sum, row) => sum + Number(row.remaining || 0), 0);
  const invoicePaid = rows.reduce((sum, row) => sum + Number(row.paid || 0), 0);
  const invoiceDebtTransactionIds = new Set(debtInvoices.map((invoice) => invoice.debtTransactionId));
  const manualBalance = transactions
    .filter((transaction) => !invoiceDebtTransactionIds.has(transaction.id) && !transaction.supplierPayment && transaction.type === "debit")
    .reduce((sum, transaction) => sum + Math.max(0, Number(transaction.amount || 0)), 0);
  const paymentExcess = unallocatedCredits;
  const net = invoiceDebt + manualBalance - paymentExcess;
  return { rows, invoiceDebt, invoicePaid, manualBalance, paymentExcess, owed: Math.max(0, net), credit: Math.max(0, -net), totalInvoices: debtInvoices.reduce((sum, invoice) => sum + Number(invoice.amount || 0), 0) };
};
const allocateSupplierPayment = (supplier, invoices, amount) => {
  const statement = getSupplierStatement(supplier, invoices);
  let remaining = Number(amount || 0);
  return statement.rows.filter((row) => row.remaining > 0).map((row) => {
    const allocated = Math.min(row.remaining, remaining);
    remaining -= allocated;
    return allocated > 0 ? { invoiceId: row.invoice.id, amount: allocated } : null;
  }).filter(Boolean);
};

function notify(message, type = "error") {
  window.dispatchEvent(new CustomEvent("factory:toast", { detail: { message, type } }));
}
function ToastHost() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    const onToast = (event) => {
      const id = uid();
      setToasts((prev) => [...prev, { id, message: event.detail?.message || "حدث أمر غير متوقع", type: event.detail?.type || "error" }]);
      window.setTimeout(() => setToasts((prev) => prev.filter((toast) => toast.id !== id)), 4200);
    };
    window.addEventListener("factory:toast", onToast);
    return () => window.removeEventListener("factory:toast", onToast);
  }, []);
  return <div className="fixed top-4 left-4 right-4 z-[100] flex flex-col items-center gap-2 pointer-events-none" dir="rtl">
    {toasts.map((toast) => <div key={toast.id} role="status" className="pointer-events-auto w-full max-w-md rounded-xl border px-4 py-3 text-sm shadow-lg" style={{ background: toast.type === "success" ? "var(--good-bg)" : "var(--warn-bg)", borderColor: toast.type === "success" ? "var(--good-border)" : "var(--warn-border)", color: toast.type === "success" ? "#4B6350" : "#A34632" }}>{toast.message}</div>)}
  </div>;
}

// ---------- persistence layer ----------
async function fetchAllOrganizationRecords(organizationId) {
  const result = await window.factoryApi.records(organizationId);
  return result.rows || [];
}

function useFactoryData(organizationId) {
  const [downloadsNs, setDownloadsNs] = useState(null);
  const [reloadToken, setReloadToken] = useState(0);
  const [ready, setReady] = useState(false);
  const [usingLocal, setUsingLocal] = useState(false);
  const [dataLoaded, setDataLoaded] = useState(false);
  const [error, setError] = useState("");
  const initial = {};
  COLLECTIONS.forEach((c) => (initial[c] = []));
  const [data, setData] = useState(initial);

  useEffect(() => {
    let cancelled = false;
    const loadLocal = () => {
      setUsingLocal(true);
      const loaded = {};
      const invalidCollections = [];
      COLLECTIONS.forEach((name) => {
        try {
          const parsed = JSON.parse(localStorage.getItem(LOCAL_PREFIX + name) || "[]");
          if (!Array.isArray(parsed)) throw new Error("Expected a collection array");
          loaded[name] = parsed;
        } catch (e) {
          invalidCollections.push(name);
          loaded[name] = [];
        }
      });
      setData(loaded);
      setError(invalidCollections.length ? "تعذرت قراءة بعض بيانات التخزين المحلي: " + invalidCollections.join(", ") : "");
      setDataLoaded(invalidCollections.length === 0);
      setReady(true);
    };
    const loadRemote = async () => {
      setDataLoaded(false);
      let rows;
      try { rows = await fetchAllOrganizationRecords(organizationId); }
      catch (queryError) { if (!cancelled) { setError(queryError.message || String(queryError)); setReady(true); } return; }
      const loaded = {};
      COLLECTIONS.forEach((name) => (loaded[name] = []));
      (rows || []).forEach((row) => { if (loaded[row.collection]) loaded[row.collection].push({ id: row.id, ...(row.payload || {}) }); });
      if (!cancelled) { setData(loaded); setError(""); setDataLoaded(true); setReady(true); }
    };
    if (!hasBackend || !organizationId) { loadLocal(); return () => { cancelled = true; }; }
    loadRemote();
    return () => { cancelled = true; };
  }, [organizationId, reloadToken]);

  const saveLocal = (name, list) => { try { localStorage.setItem(LOCAL_PREFIX + name, JSON.stringify(list)); } catch (e) { console.error(e); } };

  const upsert = async (name, docObj, options = {}) => {
    if (hasBackend && organizationId) {
      try { await window.factoryApi.upsert(organizationId, name, docObj); }
      catch (upsertError) {
        setError(upsertError.message);
        if (options.throwOnError) throw upsertError;
        return false;
      }
      setData((prev) => {
        const list = prev[name] || [];
        const idx = list.findIndex((d) => d.id === docObj.id);
        const next = idx === -1 ? [docObj, ...list] : list.map((d) => (d.id === docObj.id ? docObj : d));
        return { ...prev, [name]: next };
      });
      return true;
    } else {
      setData((prev) => {
        const list = prev[name] || [];
        const idx = list.findIndex((d) => d.id === docObj.id);
        const next = idx === -1 ? [docObj, ...list] : list.map((d) => (d.id === docObj.id ? docObj : d));
        saveLocal(name, next);
        return { ...prev, [name]: next };
      });
      return true;
    }
  };
  const remove = async (name, id) => {
    if (hasBackend && organizationId) {
      try { await window.factoryApi.remove(organizationId, name, id); }
      catch (deleteError) { setError(deleteError.message); return; }
      setData((prev) => ({ ...prev, [name]: (prev[name] || []).filter((d) => d.id !== id) }));
    } else {
      setData((prev) => { const next = (prev[name] || []).filter((d) => d.id !== id); saveLocal(name, next); return { ...prev, [name]: next }; });
    }
  };

  const reload = () => setReloadToken((value) => value + 1);
  const importBackup = async (backup) => {
    const validationError = validateJsonBackup(backup);
    if (validationError) throw new Error(validationError);
    downloadJsonBackup(data, "نسخة-احتياطية-كاملة-المصنع-" + todayISO() + "-قبل-الاستيراد.json");
    const result = await importJsonCollections(backup, data, upsert);
    reload();
    return result;
  };

  return { ready, dataLoaded, usingLocal, data, upsert, remove, downloadsNs, error, reload, importBackup };
}

async function exportBackup(downloadsNs, data) {
  if (!window.XLSX) { notify("تعذر تحميل مكتبة التصدير، حاول تحديث الصفحة."); return; }
  const wb = XLSX.utils.book_new();
  const sheets = {
    "المشاريع": data.projects.map((p) => ({ الزبون: p.customerName, الهاتف: p.phone, الموقع: p.location, النوع: p.productType, الحالة: p.status, "تاريخ الإنشاء": p.dateCreated, "تاريخ الإكمال": p.completedAt || "", الإجمالي: projectCost(p), ملاحظات: p.notes })),
    "بضاعة المشاريع": data.projects.flatMap((p) => (p.items || []).map((i) => ({ الزبون: p.customerName, الاتجاه: i.direction, المادة: i.name, الكمية: i.quantity, الوحدة: i.unit, التاريخ: i.date }))),
    "مكاييل المشاريع": data.projects.flatMap((p) => (p.measurements || []).flatMap((m) => (m.entries || []).map((e) => ({ الزبون: p.customerName, العامل: m.workerName, التاريخ: m.date, البند: e.label, الكمية: e.quantity, السعر: e.unitPrice, المجموع: e.total })))),
    "الفواتير": data.invoices.map((i) => ({ "رقم الفاتورة": i.invoiceNumber || "", النوع: i.type, المورد: i.supplierName || "", المبلغ: i.amount, التاريخ: i.date, الوصف: i.description })),
    "المصاريف": data.expenses.map((e) => ({ النوع: e.type, المبلغ: e.amount, التاريخ: e.date, الوصف: e.description })),
    "الواردات": getAllProjectIncome(data.projects, data.income).map((x) => ({ الزبون: x.customerName, المشروع: data.projects.find((p) => p.id === x.projectId)?.customerName || "", "معرف المشروع": x.projectId || "", المبلغ: x.amount, التاريخ: x.date, الوصف: x.description })),
    "دفعات المشاريع": Array.from(new Map(data.projects.flatMap((project) => getProjectPayments(project, data.income).map((payment) => [payment.paymentId || payment.id, { الزبون: project.customerName, "معرف المشروع": project.id, "تاريخ الدفعة": payment.date, المبلغ: payment.amount, "وصف الدفعة": payment.description || "" }]))).values()),
    "المخزون": data.inventory.map((i) => ({ المادة: i.name, الكمية: i.quantity, الوحدة: i.unit, "حد التنبيه": i.minThreshold })),
    "العملاء": data.customers.map((c) => ({ الاسم: c.name, الهاتف: c.phone, الرصيد: contactBalance(c), ملاحظات: c.notes })),
    "العمال": data.workers.map((c) => ({ الاسم: c.name, الهاتف: c.phone, الرصيد: contactBalance(c), ملاحظات: c.notes })),
    "الموردون": data.suppliers.map((c) => ({ الاسم: c.name, الهاتف: c.phone, الرصيد: contactBalance(c), ملاحظات: c.notes })),
    "الحضور": data.attendance.map((a) => ({ العامل: a.workerName, التاريخ: a.date, الحالة: a.status })),
    "سجلي الشخصي": data.personalLog.map((p) => ({ النوع: p.type, المبلغ: p.amount, التاريخ: p.date, الوصف: p.description })),
  };
  Object.entries(sheets).forEach(([name, rows]) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ "لا توجد بيانات": "" }]);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  });
  const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const filename = "تقرير-المصنع-ملخص-" + todayISO() + ".xlsx";
  if (downloadsNs) { try { await downloadsNs.save({ filename, data: blob }); } catch (e) { console.error("export failed", e); } }
  else downloadBlob(blob, filename);
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.download = filename; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const buildJsonBackup = (data) => ({
  schemaVersion: 1,
  exportedAt: new Date().toISOString(),
  collections: Object.fromEntries(COLLECTIONS.map((name) => {
    if (!data || !Array.isArray(data[name])) throw new Error(`بيانات مجموعة ${name} غير مكتملة؛ لم يتم إنشاء النسخة.`);
    return [name, data[name]];
  })),
});

function downloadJsonBackup(data, filename = "نسخة-احتياطية-كاملة-المصنع-" + todayISO() + ".json") {
  const json = JSON.stringify(buildJsonBackup(data), null, 2);
  downloadBlob(new Blob([json], { type: "application/json;charset=utf-8" }), filename);
}

function validateJsonBackup(value) {
  if (!value || typeof value !== "object" || Array.isArray(value)) return "ملف النسخة يجب أن يحتوي على كائن JSON.";
  if (value.schemaVersion !== 1) return "إصدار النسخة غير مدعوم.";
  if (!value.collections || typeof value.collections !== "object" || Array.isArray(value.collections)) return "قسم collections غير موجود أو غير صالح.";
  const unsupportedCollections = Object.keys(value.collections).filter((name) => !COLLECTIONS.includes(name));
  if (unsupportedCollections.length) return `النسخة تحتوي مجموعات لا يدعمها هذا الإصدار: ${unsupportedCollections.join(", ")}.`;
  for (const name of COLLECTIONS) {
    const records = value.collections[name];
    if (!Array.isArray(records)) return `مجموعة ${name} غير موجودة أو ليست مصفوفة.`;
    const ids = new Set();
    for (const record of records) {
      if (!record || typeof record !== "object" || Array.isArray(record)) return `يوجد سجل تالف في مجموعة ${name}.`;
      if (typeof record.id !== "string" || !record.id.trim()) return `يوجد سجل بلا معرف في مجموعة ${name}.`;
      if (ids.has(record.id)) return `المعرف ${record.id} مكرر داخل مجموعة ${name}.`;
      ids.add(record.id);
      if (["invoices", "expenses", "income", "personalLog"].includes(name) && !positiveNumber(record.amount)) return `المبلغ في مجموعة ${name} يجب أن يكون موجبًا.`;
      if (name === "projects") {
        for (const payment of record.payments || []) if (!payment || !positiveNumber(payment.amount)) return `دفعة غير صالحة في المشروع ${record.id}.`;
      }
      for (const transaction of record.transactions || []) if (!transaction || !positiveNumber(transaction.amount)) return `معاملة غير صالحة في السجل ${record.id}.`;
    }
  }
  return "";
}

async function importJsonCollections(backup, currentData, upsertRecord) {
  let added = 0;
  let updated = 0;
  for (const name of COLLECTIONS) {
    const currentIds = new Set((currentData[name] || []).map((record) => record.id));
    for (const record of backup.collections[name]) {
      if (currentIds.has(record.id)) updated += 1;
      else added += 1;
      await upsertRecord(name, record, { throwOnError: true });
    }
  }
  return { added, updated };
}

function useAuth() {
  const [session, setSession] = useState(null);
  const [organization, setOrganization] = useState(null);
  const [loading, setLoading] = useState(hasBackend);
  const [error, setError] = useState("");

  useEffect(() => {
    if (!hasBackend) { setLoading(false); return undefined; }
    window.factoryApi.me().then((result) => {
      setSession({ user: result.user });
      setOrganization(result.organization);
    }).catch(() => {}).finally(() => setLoading(false));
    return undefined;
  }, []);

  const signIn = async (email, password) => {
    try { const result = await window.factoryApi.signIn(email, password); setSession({ user: result.user }); setOrganization(result.organization); return { data: result, error: null }; }
    catch (error) { return { data: null, error }; }
  };
  const signUp = async (email, password, organizationName, organizationCode) => {
    try { const result = await window.factoryApi.signUp(email, password, organizationName, organizationCode); setSession({ user: result.user }); setOrganization(result.organization); return { data: { session: result }, error: null }; }
    catch (error) { return { data: null, error }; }
  };
  const signOut = () => { window.factoryApi.signOut(); setSession(null); setOrganization(null); };
  return { session, organization, loading, error, signIn, signUp, signOut };
}

          <div className="px-2 text-[10px] leading-relaxed text-stone-500">نسخة JSON تحفظ بيانات التطبيق وحقولها؛ لا تشمل حسابات المستخدمين أو إعدادات Supabase.</div>
          {usingLocal && <div className="px-2 text-[10px] leading-relaxed text-stone-500">يعمل التطبيق حاليًا بتخزين محلي على هذا المتصفح فقط.</div>}
          {organizationCode && <div className="px-2 text-[10px] leading-relaxed text-stone-400">رمز مشاركة الشركة: {organizationCode}</div>}

      </aside>

      <div className="sm:hidden fixed bottom-0 inset-x-0 z-40 flex justify-around py-2 overflow-x-auto" style={{ background: "#2B2A27" }}>
        {NAV.map((n) => {
          const active = tab === n.key;
          return (
            <button key={n.key} onClick={() => setTab(n.key)} className="flex flex-col items-center gap-0.5 px-2 py-1 shrink-0">
              <Icon name={n.icon} size={18} color={active ? "var(--accent)" : "#8b8880"} />
              <span className="text-[8px]" style={{ color: active ? "var(--accent)" : "#8b8880" }}>{n.label}</span>
            </button>

          <img src="Earthlog.jpeg" alt="شعار الشركة" className="w-9 h-9 rounded-xl object-cover shrink-0" />
          <div className="min-w-0 flex-1">
            <div className="text-sm font-bold truncate" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>شركة الشرق الكبرى للطلاء الخارجي</div>
            <div className="text-[10px] truncate" style={{ color: "var(--text-muted)" }}>{email || "حساب الشركة"}{organizationCode ? " · رمز الشركة: " + organizationCode : ""}</div>
          </div>
          {email && <button onClick={onSignOut} className="shrink-0 text-xs px-2.5 py-1.5 rounded-lg border" style={{ color: "var(--text-body)", borderColor: "var(--card-border)" }}>تسجيل الخروج</button>}
        </div>

          <div className="text-xs font-semibold" style={{ color: "var(--text-body)" }}>النسخ الاحتياطي</div>
          <div className="grid grid-cols-1 gap-2">
            <button disabled={!dataLoaded} onClick={() => exportBackup(downloadsNs, data)} className="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg text-xs border disabled:opacity-50 disabled:cursor-not-allowed" style={{ borderColor: "var(--card-border)", color: "var(--text-body)" }}><Icon name="download" size={14} /> تقرير Excel (ملخص)</button>
            <button disabled={!dataLoaded} onClick={() => downloadJsonBackup(data)} className="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg text-xs border disabled:opacity-50 disabled:cursor-not-allowed" style={{ borderColor: "var(--card-border)", color: "var(--text-body)" }}><Icon name="download" size={14} /> نسخة احتياطية كاملة (JSON)</button>
            <button disabled={!dataLoaded} onClick={() => importInputRef.current?.click()} className="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg text-xs border disabled:opacity-50 disabled:cursor-not-allowed" style={{ borderColor: "var(--card-border)", color: "var(--text-body)" }}><Icon name="upload" size={14} /> استيراد نسخة JSON</button>
          </div>
          <div className="text-[10px] leading-relaxed" style={{ color: "var(--text-muted)" }}>الاستيراد يدمج البيانات ويحدّث السجلات ذات المعرف نفسه. JSON يشمل بيانات التطبيق، ولا يشمل حسابات المستخدمين أو إعدادات Supabase.</div>
        </div>
        {tab === "dashboard" && (
          <Dashboard projects={projects} invoices={invoices} lowStock={lowStock} customerDebt={customerDebt}
            monthIncome={monthIncome} monthExpense={monthExpense} monthInvoices={monthInvoices}
            onOpenProject={(id) => setOpenProjectId(id)} goProjects={() => setTab("projects")} />

        {tab === "finance" && <FinanceTab expenses={expenses} income={income} projects={projects} customers={customers} upsert={upsert} remove={remove} />}
        {tab === "accounts" && (
          <AccountsTab sub={accountsSub} setSub={setAccountsSub}

            projects={projects} income={income} onOpenProject={(id) => setOpenProjectId(id)} />
        )}
        {tab === "attendance" && <AttendanceTab workers={workers} attendance={attendance} upsert={upsert} remove={remove} />}
        {tab === "inventory" && <InventoryTab inventory={inventory} upsert={upsert} remove={remove} />}
        {tab === "reports" && (
          <ReportsTab month={reportMonth} setMonth={setReportMonth} projects={projects} invoices={invoices} expenses={expenses} income={income}
            attendance={attendance} workers={workers} customers={customers} suppliers={suppliers} downloadsNs={downloadsNs} />
        )}
        {tab === "personal" && <PersonalLogTab data={personalLog} upsert={upsert} remove={remove} />}
      </main>

      {openProject && (
        <ProjectDetail project={openProject} onClose={() => setOpenProjectId(null)} onSave={(updated) => upsert("projects", updated)}
          onDeletePayment={(payment) => {
            const paymentId = payment.paymentId || payment.id;
            income.filter((entry) => entry.projectId === openProject.id && (entry.paymentId || entry.id) === paymentId).forEach((entry) => remove("income", entry.id));
          }}
          onDelete={() => { income.filter((entry) => entry.projectId === openProject.id).forEach((entry) => remove("income", entry.id)); remove("projects", openProject.id); setOpenProjectId(null); }}
          onAddPayment={(nextProject, payment) => {
            upsert("projects", nextProject);
            upsert("income", { id: payment.id, paymentId: payment.id, projectId: nextProject.id, date: payment.date, customerName: nextProject.customerName, amount: payment.amount, includeInIncome: payment.includeInIncome !== false, description: payment.description });
          }}
          customers={customers} income={income} upsertCustomer={(c) => upsert("customers", c)} />
      )}
      {showNewProject && (
        <NewProjectModal onClose={() => setShowNewProject(false)} onCreate={(proj) => { upsert("projects", proj); (proj.payments || []).forEach((payment) => upsert("income", { id: payment.id, paymentId: payment.id, projectId: proj.id, date: payment.date, customerName: proj.customerName, amount: payment.amount, includeInIncome: payment.includeInIncome !== false, description: payment.description })); setShowNewProject(false); setOpenProjectId(proj.id); }}
          customers={customers} upsert={upsert} />
      )}
    </div>
  );
}

// ---------- Dashboard ----------

  const active = projects.filter((p) => p.status === "قيد التنفيذ");
  const leads = projects.filter((p) => p.status === "جديد");
  const recentInvoices = [...invoices].sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 5);
  const net = monthIncome - monthExpense - monthInvoices;

  return (
    <div className="flex flex-col gap-6">
      <div>
        <h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>لوحة التحكم</h1>
        <p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>نظرة عامة على المصنع اليوم</p>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard icon="hammer" label="مشاريع جارية" value={active.length} accent="#6E8F72" />
        <StatCard icon="circleDot" label="مشاريع قادمة" value={leads.length} accent="#C69C4B" />
        <StatCard icon="alert" label="مواد ناقصة بالمخزون" value={lowStock.length} accent="#A34632" />
        <StatCard icon={net >= 0 ? "trendUp" : "trendDown"} label="صافي الحركة النقدية" value={fmt(net)} sub="واردات − مصاريف − فواتير مدفوعة" accent={net >= 0 ? "#4B6350" : "#A34632"} />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-3">
        <StatCard icon="users" label="مستحقات على العملاء" value={fmt(customerDebt)} accent="#A6673B" />
        <div className="rounded-2xl border p-4 lg:col-span-2" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>تنبيهات المخزون</h3>
          {lowStock.length === 0 ? <EmptyState icon="package" title="المخزون ضمن الحد الطبيعي" /> : (
            <div className="flex flex-col gap-2">
              {lowStock.map((i) => (
                <div key={i.id} className="flex items-center justify-between rounded-xl px-3 py-2.5" style={{ background: "var(--warn-bg)" }}>
                  <div className="text-sm" style={{ color: "var(--text-body)" }}>{i.name}</div>
                  <div className="text-xs font-medium" style={{ color: "#A34632" }}>{fmt(i.quantity)} {i.unit} متبقٍ</div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-semibold text-sm" style={{ color: "var(--text-body)" }}>مشاريع قادمة (جديدة)</h3>
          <button onClick={goProjects} className="text-xs flex items-center gap-1" style={{ color: "var(--accent)" }}>عرض الكل <Icon name="arrowRight" size={12} /></button>
        </div>
        {leads.length === 0 ? <EmptyState icon="circleDot" title="لا توجد مشاريع جديدة" sub="أضف مشروعًا عند اتصال زبون" /> : (
          <div className="grid sm:grid-cols-2 gap-2">
            {leads.slice(0, 6).map((p) => (
              <button key={p.id} onClick={() => onOpenProject(p.id)} className="flex items-center justify-between rounded-xl border px-3 py-2.5 text-right transition" style={{ borderColor: "var(--divider)" }}>
                <div>
                  <div className="text-sm font-medium" style={{ color: "var(--text-strong)" }}>{p.customerName}</div>
                  <div className="text-xs flex items-center gap-1 mt-0.5" style={{ color: "var(--text-muted)" }}><Icon name="mappin" size={11} /> {p.location || "بدون موقع"}</div>
                </div>
                <Badge bg={STATUS_COLOR[p.status].bg} fg={STATUS_COLOR[p.status].fg}>{p.productType}</Badge>
              </button>
            ))}
          </div>
        )}
      </div>

      <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
        <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>أحدث الفواتير</h3>
        {recentInvoices.length === 0 ? <EmptyState icon="receipt" title="لا توجد فواتير مسجّلة بعد" /> : (

// ---------- Projects ----------
function Projects({ projects, onOpen, onNew }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("الكل");
  const normalizedQuery = normalizeName(query);
  const filtered = projects.filter((p) => {
    const workerNames = (p.measurements || []).map((measurement) => measurement.workerName || "");
    const searchable = [p.customerName, p.location, ...workerNames].map(normalizeName);
    const matchQ = !normalizedQuery || searchable.some((value) => value.includes(normalizedQuery));
    const matchS = statusFilter === "الكل" || p.status === statusFilter;
    return matchQ && matchS;
  });
  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>المشاريع</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>إدارة الزبائن، البضاعة المرسلة، والمكاييل</p></div>
        <PrimaryButton onClick={onNew}><Icon name="plus" size={16} /> مشروع جديد</PrimaryButton>
      </div>
      <div className="flex items-center gap-3 flex-wrap">
        <div className="relative flex-1 min-w-[180px]">
          <span className="absolute right-3 top-1/2 -translate-y-1/2" style={{ color: "var(--text-muted)" }}><Icon name="search" size={15} /></span>
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="بحث باسم الزبون أو الموقع أو العامل..." className="w-full rounded-lg border pr-9 pl-3 py-2 text-sm outline-none" style={{ background: "var(--input-bg)", borderColor: "var(--card-border)", color: "var(--text-strong)" }} />
        </div>
        <div className="flex gap-1.5 flex-wrap">
          {["الكل", ...STATUSES].map((s) => (
            <button key={s} onClick={() => setStatusFilter(s)} className="text-xs px-3 py-2 rounded-lg border transition" style={statusFilter === s ? { background: "var(--accent)", borderColor: "var(--accent)", color: "white" } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-body)" }}>{s}</button>
          ))}
        </div>
      </div>
      {filtered.length === 0 ? <EmptyState icon="factory" title="لا توجد مشاريع مطابقة" sub="أضف مشروعًا جديدًا للبدء" /> : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {filtered.map((p) => {
            const totalMeasured = (p.measurements || []).reduce((s, m) => s + Number(m.totalAmount || 0), 0);
            return (
              <button key={p.id} onClick={() => onOpen(p.id)} className="text-right rounded-2xl border p-4 hover:shadow-sm transition flex flex-col gap-3" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
                <div className="flex items-start justify-between">
                  <div><div className="font-semibold" style={{ color: "var(--text-strong)" }}>{p.customerName}</div><div className="text-xs flex items-center gap-1 mt-1" style={{ color: "var(--text-muted)" }}><Icon name="mappin" size={11} /> {p.location || "بدون موقع"}</div></div>
                  <Badge bg={STATUS_COLOR[p.status].bg} fg={STATUS_COLOR[p.status].fg}>{p.status}</Badge>
                </div>
                <div className="flex items-center justify-between text-xs pt-2 border-t" style={{ color: "var(--text-muted)", borderColor: "var(--divider)" }}><span>{p.productType}</span><span>{totalMeasured > 0 ? fmt(totalMeasured) + " إجمالي" : p.dateCreated}</span></div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function SearchablePicker({ items, value, onSelect, getLabel, getSearchText, placeholder, emptyText = "لا توجد نتائج مطابقة" }) {
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(false);
  const selected = items.find((item) => item.id === value);
  const normalizedQuery = normalizeName(query);
  const filtered = items.filter((item) => !normalizedQuery || normalizeName(getSearchText(item)).includes(normalizedQuery));

  return (
    <div className="relative">
      <TextInput
        value={open ? query : (selected ? getLabel(selected) : "")}
        placeholder={placeholder}
        onFocus={() => { setOpen(true); setQuery(""); }}
        onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
        onBlur={() => window.setTimeout(() => setOpen(false), 150)}
      />
      {open && (
        <div className="absolute inset-x-0 top-full z-20 mt-1 max-h-56 overflow-y-auto rounded-lg border shadow-lg" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          {filtered.length === 0 ? <div className="px-3 py-2 text-xs" style={{ color: "var(--text-muted)" }}>{emptyText}</div> : filtered.map((item) => (
            <button key={item.id} type="button" onMouseDown={(e) => e.preventDefault()} onClick={() => { onSelect(item.id); setQuery(""); setOpen(false); }} className="w-full px-3 py-2 text-right text-sm border-b last:border-b-0" style={{ color: "var(--text-body)", borderColor: "var(--divider)" }}>
              {getLabel(item)}
            </button>
          ))}
        </div>
      )}
      {selected && <button type="button" onClick={() => { onSelect(null); setQuery(""); setOpen(false); }} className="absolute left-2 top-1/2 -translate-y-1/2 text-xs" style={{ color: "var(--text-muted)" }}>مسح</button>}
    </div>
  );
}

function CustomerPicker({ customers, customerId, customerName, onSelect, onCreateNew }) {
  const [addingNew, setAddingNew] = useState(false);
  const [newName, setNewName] = useState("");
  const [newPhone, setNewPhone] = useState("");

  const confirmNew = () => {
    if (!newName.trim() || hasDuplicateName(customers, newName)) { notify("اسم العميل موجود مسبقًا أو غير صالح."); return; }
    const c = { id: uid(), name: newName.trim(), phone: newPhone.trim(), notes: "", transactions: [] };
    onCreateNew(c);
    setAddingNew(false);
  };

  return (
    <div className="flex flex-col gap-2">
      {!addingNew && <SearchablePicker items={customers} value={customerId} onSelect={onSelect} placeholder="ابحث باسم العميل أو الهاتف..." getLabel={(c) => c.name + (c.phone ? " — " + c.phone : "")} getSearchText={(c) => [c.name, c.phone].filter(Boolean).join(" ")} />}
      {!addingNew && <button type="button" onClick={() => { setAddingNew(true); setNewName(""); setNewPhone(""); }} className="text-xs self-start" style={{ color: "var(--accent)" }}>+ إضافة عميل جديد</button>}
      {addingNew && (
        <div className="rounded-lg border p-2.5 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
          <TextInput placeholder="اسم العميل الجديد" value={newName} onChange={(e) => setNewName(e.target.value)} />
          <TextInput placeholder="رقم الهاتف (اختياري)" value={newPhone} onChange={(e) => setNewPhone(e.target.value)} />
          <div className="flex gap-2">
            <PrimaryButton onClick={confirmNew} disabled={!newName.trim()}><Icon name="plus" size={14} /> إضافة واختيار</PrimaryButton>
            <GhostButton onClick={() => setAddingNew(false)}>إلغاء</GhostButton>
          </div>
        </div>
      )}
      {!addingNew && customerName && !customerId && (
        <div className="text-xs" style={{ color: "var(--text-muted)" }}>هذا المشروع مرتبط باسم قديم غير مسجّل كعميل بعد: «{customerName}» — اختر عميلاً من القائمة أعلاه لربطه.</div>
      )}
    </div>
  );
}

function NewProjectModal({ onClose, onCreate, customers, upsert }) {
  const [customerId, setCustomerId] = useState("");
  const [phone, setPhone] = useState("");
  const [dateCreated, setDateCreated] = useState(todayISO());
  const [initialPayment, setInitialPayment] = useState("");
  const [includeInitialPaymentInIncome, setIncludeInitialPaymentInIncome] = useState(true);
  const [initialPaymentDate, setInitialPaymentDate] = useState(todayISO());
  const [initialPaymentNote, setInitialPaymentNote] = useState("");
  const [location, setLocation] = useState("");
  const [productType, setProductType] = useState("تكس");
  const [notes, setNotes] = useState("");
  const [createdCustomer, setCreatedCustomer] = useState(null);

  const handleCreateCustomer = (c) => { upsert("customers", c); setCreatedCustomer(c); setCustomerId(c.id); if (!phone) setPhone(c.phone || ""); };

  const submit = () => {
    const customer = customers.find((c) => c.id === customerId) || createdCustomer;
    if (!customer) return;
    if (initialPayment !== "" && !positiveNumber(initialPayment)) { notify("مبلغ الدفعة الأولى يجب أن يكون موجبًا."); return; }
    if (positiveNumber(initialPayment)) {
      if (!initialPaymentDate) { notify("اختر تاريخ الدفعة الأولى."); return; }
      if (!dateCreated) { notify("اختر تاريخ إنشاء المشروع."); return; }
      if (initialPaymentDate < dateCreated) { notify("لا يمكن أن تسبق الدفعة تاريخ إنشاء المشروع."); return; }
    }
    const payment = positiveNumber(initialPayment) ? { id: uid(), date: initialPaymentDate, amount: Number(initialPayment), includeInIncome: includeInitialPaymentInIncome, description: initialPaymentNote.trim() || "دفعة عند إنشاء المشروع" } : null;
    onCreate({ id: uid(), customerId: customer.id, customerName: customer.name, phone: (phone.trim() || customer.phone || ""), location: location.trim(), productType, status: "جديد", dateCreated, notes: notes.trim(), items: [], measurements: [], payments: payment ? [payment] : [], completedAt: null });
  };
  return (
    <Modal title="مشروع جديد" onClose={onClose}>
      <div className="flex flex-col gap-3">
        <div><FieldLabel>العميل</FieldLabel><CustomerPicker customers={customers} customerId={customerId} onSelect={setCustomerId} onCreateNew={handleCreateCustomer} /></div>
        <div><FieldLabel>رقم هاتف خاص بهذا المشروع (اختياري)</FieldLabel><TextInput value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="اتركه فارغًا لاستخدام هاتف العميل" /></div>
        <div className="grid grid-cols-2 gap-3"><div><FieldLabel>تاريخ إنشاء المشروع</FieldLabel><TextInput type="date" value={dateCreated} onChange={(e) => setDateCreated(e.target.value)} /></div><div><FieldLabel>تاريخ الدفعة الأولى</FieldLabel><TextInput type="date" value={initialPaymentDate} onChange={(e) => setInitialPaymentDate(e.target.value)} /></div></div>
        <div><FieldLabel>الواصل من الزبون عند إنشاء المشروع (اختياري)</FieldLabel><TextInput type="number" value={initialPayment} onChange={(e) => setInitialPayment(e.target.value)} placeholder="اتركه فارغًا إذا لم يدفع" /></div>
        {positiveNumber(initialPayment) && <label className="flex items-center gap-2 text-xs" style={{ color: "var(--text-body)" }}><input type="checkbox" checked={includeInitialPaymentInIncome} onChange={(e) => setIncludeInitialPaymentInIncome(e.target.checked)} /> احتساب الدفعة ضمن الواردات</label>}
        {positiveNumber(initialPayment) && <div><FieldLabel>ملاحظة الدفعة (اختياري)</FieldLabel><TextInput value={initialPaymentNote} onChange={(e) => setInitialPaymentNote(e.target.value)} /></div>}
        <div><FieldLabel>موقع المشروع</FieldLabel><TextInput value={location} onChange={(e) => setLocation(e.target.value)} placeholder="الحي / المنطقة" /></div>
        <div><FieldLabel>نوع المنتج المطلوب</FieldLabel><Select value={productType} onChange={(e) => setProductType(e.target.value)}>{PRODUCT_TYPES.map((t) => <option key={t}>{t}</option>)}</Select></div>
        <div><FieldLabel>ملاحظات (اختياري)</FieldLabel><textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ background: "var(--input-bg)", borderColor: "var(--card-border)", color: "var(--text-strong)" }} /></div>
        <PrimaryButton onClick={submit} full disabled={!customerId}><Icon name="plus" size={16} /> إنشاء المشروع</PrimaryButton>
      </div>
    </Modal>
  );
}

  const isSettled = sm.settled || (invoiceTotal > 0 && remaining === 0 && sm.surplus === 0);
  const statusText = isSettled ? "خالص" : sm.surplus > 0 ? "خالص — رصيد للزبون" : "غير خالص";
  const invoiceNumber = String(project.id || "").replace(/[^0-9]/g, "").slice(-6) || "000001";

function printAccountStatement(kind, contact, { invoices = [], projects = [], income = [] } = {}) {
  const isSupplier = kind === "supplier";
  const byDate = (a, b) => (a.date || "").localeCompare(b.date || "");
  const td = (value, cls = "") => `<td${cls ? ` class="${cls}"` : ""}>${value}</td>`;
  const table = (heads, rows, empty) => `<table><thead><tr>${heads.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length ? rows.join("") : `<tr><td colspan="${heads.length}" class="empty">${empty}</td></tr>`}</tbody></table>`;
  const section = (title, inner) => `<h3 class="sec">${title}</h3>${inner}`;
  const sumRow = (label, value, cls = "") => `<div class="sum-row ${cls}"><span>${label}</span><strong>${value}</strong></div>`;
  let bodyHtml = "";
  let totalLabel = "";
  let totalValue = 0;
  let totalIsGood = false;

  if (isSupplier) {
    const st = getSupplierStatement(contact, invoices);
    const txs = [...(contact.transactions || [])].sort(byDate);
    const invoiceTxIds = new Set(st.rows.map((r) => r.invoice.debtTransactionId));
    const payments = txs.filter((t) => t.supplierPayment);
    const manual = txs.filter((t) => !t.supplierPayment && !invoiceTxIds.has(t.id));
    bodyHtml += section("الفواتير الآجلة", table(["التاريخ", "رقم الفاتورة", "النوع", "المبلغ", "المسدد", "المتبقي"], st.rows.map((r) => `<tr>${td(escapeHtml(r.invoice.date || ""))}${td(escapeHtml(r.invoice.invoiceNumber || "—"))}${td(escapeHtml(r.invoice.type || ""))}${td(fmt(r.invoice.amount))}${td(fmt(r.paid), "good")}${td(r.remaining ? fmt(r.remaining) : "مسددة", r.remaining ? "bad" : "good")}</tr>`), "لا توجد فواتير آجلة"));
    bodyHtml += section("دفعات السداد", table(["التاريخ", "البيان", "المبلغ"], payments.map((t) => `<tr>${td(escapeHtml(t.date || ""))}${td(escapeHtml(t.note || "سداد"), "name")}${td(fmt(t.amount), "good")}</tr>`), "لا توجد دفعات سداد"));
    if (manual.length) bodyHtml += section("حركات يدوية", table(["التاريخ", "البيان", "النوع", "المبلغ"], manual.map((t) => `<tr>${td(escapeHtml(t.date || ""))}${td(escapeHtml(t.note || ""), "name")}${td(t.type === "debit" ? "زيادة علينا" : "رصيد لنا / تسوية")}${td(fmt(t.amount), t.type === "debit" ? "bad" : "good")}</tr>`), ""));
    const net = st.invoiceDebt + st.manualBalance - st.paymentExcess;
    totalValue = Math.abs(net); totalIsGood = net <= 0;
    totalLabel = net > 0 ? "المستحق للمورد (علينا)" : net < 0 ? "رصيد لنا عند المورد" : "الرصيد";
    bodyHtml += `<div class="summary">${sumRow("إجمالي الفواتير الآجلة", fmt(st.totalInvoices))}${sumRow("المسدد من الفواتير", fmt(st.invoicePaid), "good")}${sumRow("المتبقي من الفواتير", fmt(st.invoiceDebt))}${sumRow("حركات يدوية (علينا)", fmt(st.manualBalance))}${st.paymentExcess > 0 ? sumRow("دفعات زائدة (رصيد لنا)", fmt(st.paymentExcess), "good") : ""}${sumRow(totalLabel, fmt(totalValue), "main")}</div>`;
  } else {
    const txs = [...(contact.transactions || [])].sort(byDate);
    let running = 0;
    const ledgerRows = txs.map((t) => { running += t.type === "debit" ? Number(t.amount || 0) : -Number(t.amount || 0); return `<tr>${td(escapeHtml(t.date || ""))}${td(escapeHtml(t.note || (t.type === "debit" ? "زيادة دين" : "تسديد")), "name")}${td(t.type === "debit" ? fmt(t.amount) : "", "bad")}${td(t.type === "credit" ? fmt(t.amount) : "", "good")}${td(fmt(running))}</tr>`; });
    const manualBalance = contactBalance(contact);
    const sums = projects.map((p) => ({ p, m: getProjectSummary(p, income) }));
    const projectsRemaining = sums.reduce((sum, x) => sum + x.m.remaining, 0);
    const projectsSurplus = sums.reduce((sum, x) => sum + x.m.surplus, 0);
    const projectRows = sums.map(({ p, m }) => `<tr>${td(escapeHtml(p.location || "بدون موقع"), "name")}${td(escapeHtml(p.status || ""))}${td(fmt(m.cost))}${td(m.waived ? fmt(m.waived) : "—")}${td(fmt(m.paid), "good")}${td(m.remaining ? "باقي " + fmt(m.remaining) : m.surplus ? "رصيد له " + fmt(m.surplus) : m.advance ? "دفعة مقدمة " + fmt(m.advance) : m.settled ? "خالص" : "بانتظار الكيل", m.remaining ? "bad" : "good")}</tr>`);
    const payRows = sums.flatMap(({ p }) => getProjectPayments(p, income).map((pay) => ({ ...pay, project: p }))).sort(byDate).map((pay) => `<tr>${td(escapeHtml(pay.date || ""))}${td(escapeHtml(pay.project.location || pay.project.customerName || ""), "name")}${td(escapeHtml(pay.description || "دفعة"))}${td(fmt(pay.amount), "good")}</tr>`);
    const direct = getCustomerDirectPayments(contact, income);
    const directTotal = direct.reduce((sum, e) => sum + Number(e.amount || 0), 0);
    const directRows = direct.map((e) => `<tr>${td(escapeHtml(e.date || ""))}${td(escapeHtml(e.description || "دفعة"), "name")}${td(fmt(e.amount), "good")}</tr>`);
    bodyHtml += section("حركات الحساب اليدوية", table(["التاريخ", "البيان", "عليه", "له", "الرصيد"], ledgerRows, "لا توجد حركات يدوية"));
    bodyHtml += section("المشاريع", table(["الموقع", "الحالة", "التكلفة", "الخصم", "الواصل", "الموقف"], projectRows, "لا توجد مشاريع مرتبطة"));
    bodyHtml += section("دفعات المشاريع", table(["التاريخ", "المشروع", "البيان", "المبلغ"], payRows, "لا توجد دفعات على المشاريع"));
    bodyHtml += section("دفعات مباشرة (بدون مشروع)", table(["التاريخ", "البيان", "المبلغ"], directRows, "لا توجد دفعات مباشرة"));
    const net = manualBalance + projectsRemaining - projectsSurplus - directTotal;
    totalValue = Math.abs(net); totalIsGood = net <= 0;
    totalLabel = net > 0 ? "المستحق على الزبون" : net < 0 ? "رصيد للزبون" : "الرصيد";
    bodyHtml += `<div class="summary">${sumRow("الرصيد اليدوي", fmt(manualBalance))}${sumRow("باقي المشاريع", fmt(projectsRemaining))}${projectsSurplus > 0 ? sumRow("رصيد فائض مشاريع مكتملة (−)", fmt(projectsSurplus), "good") : ""}${directTotal > 0 ? sumRow("دفعات مباشرة (−)", fmt(directTotal), "good") : ""}${sumRow(totalLabel, fmt(totalValue), "main")}</div>`;
  }

  const title = (isSupplier ? "كشف حساب مورّد" : "كشف حساب زبون") + " - " + (contact.name || "");
  const logoUrl = new URL("Earthlog.jpeg", window.location.href).href;
  const printWindow = window.open("", "_blank", "width=900,height=1000");
  if (!printWindow) { notify("يرجى السماح بالنوافذ المنبثقة لطباعة الكشف."); return; }
  const html = `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>${escapeHtml(title)}</title><style>
    @page{size:A4 portrait;margin:10mm}
    *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    :root{--ink:#17212b;--muted:#64727d;--brand:#125b5f;--brand-dark:#0b3e42;--gold:#d8a84e;--line:#dce6e7;--soft:#f1f7f6}
    body{margin:0;background:#eef2f1;color:var(--ink);font-family:'Cairo',Arial,Tahoma,sans-serif;font-size:12px}
    .page{width:210mm;margin:0 auto;background:#fff;padding:8mm 12mm 10mm}
    .topline{height:5mm;margin:-8mm -12mm 6mm;background:linear-gradient(90deg,var(--brand-dark),var(--brand),var(--gold))}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
    .identity{display:flex;align-items:center;gap:12px}
    .logo{width:54px;height:54px;border-radius:12px;object-fit:cover}
    .company{font-size:19px;font-weight:800;color:var(--brand-dark)}
    .subtitle{font-size:11px;color:var(--muted);font-weight:600}
    .address{font-size:10px;color:var(--muted);margin-top:3px}
    .meta{font-size:11px;color:var(--muted);text-align:left}
    .meta b{color:var(--brand-dark)}
    .title-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
    .title{font-size:19px;font-weight:800;color:var(--brand-dark);margin:0}
    .badge{border-radius:999px;background:var(--brand);color:#fff;padding:5px 14px;font-size:10px;font-weight:700}
    .party{border:1px solid var(--line);border-radius:12px;padding:7px 12px;background:var(--soft);display:flex;gap:24px;flex-wrap:wrap}
    .party span{color:var(--muted);font-size:10px;display:block}
    .party strong{font-size:13px}
    .sec{font-size:13px;color:var(--brand-dark);margin:12px 0 5px}
    table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    th{background:var(--brand-dark);color:#fff;padding:6px 5px;font-size:10.5px}
    td{padding:5px;border-top:1px solid var(--line);text-align:center;font-size:11px}
    td.name{text-align:right}
    td.empty{color:var(--muted);padding:12px}
    td.good{color:#267044;font-weight:700}td.bad{color:#a04336;font-weight:700}
    tbody tr:nth-child(even) td{background:#f8fbfa}
    tr{page-break-inside:avoid}
    .summary{margin:14px 0 0 auto;width:62%;border:1px solid var(--line);border-radius:12px;overflow:hidden;page-break-inside:avoid}
    .sum-row{display:flex;justify-content:space-between;padding:6px 11px;font-size:11px}
    .sum-row+.sum-row{border-top:1px solid var(--line)}
    .sum-row.good{color:#267044}
    .sum-row.main{background:${totalIsGood ? "#267044" : "#a04336"};color:#fff;font-size:13px;font-weight:800}
    .words{margin-top:8px;font-size:11px;font-weight:700;color:var(--ink)}
    .signatures{display:grid;grid-template-columns:1fr 1fr;gap:45px;margin:22px 20px 0;text-align:center;color:var(--muted);font-size:10px;page-break-inside:avoid}
    .signature-line{border-top:1px solid #9daeb0;margin-top:20px;padding-top:4px}
    .footer{margin-top:14px;padding:7px;background:var(--brand-dark);color:#fff;text-align:center;font-size:10.5px;font-weight:700;border-radius:8px}
    @media print{body{background:#fff}.page{margin:0;width:auto;padding:0}.topline{margin:0 0 6mm}}
  </style></head><body><main class="page"><div class="topline"></div>
    <header class="header"><div class="identity"><img class="logo" src="${logoUrl}" alt="" /><div><div class="company">شركة مجموعة الشرق الكبرى</div><div class="subtitle">للطلاء الخارجي</div><div class="address">ليبيا - طرابلس - عين زارة - بجانب شيل البرقان</div></div></div><div class="meta">تاريخ الكشف<br><b>${todayISO()}</b></div></header>
    <div class="title-row"><h1 class="title">${isSupplier ? "كشف حساب مورّد" : "كشف حساب زبون"}</h1><span class="badge">${totalLabel}: ${fmt(totalValue)} دينار</span></div>
    <div class="party"><div><span>${isSupplier ? "اسم المورّد" : "اسم الزبون"}</span><strong>${escapeHtml(contact.name || "")}</strong></div>${contact.phone ? `<div><span>الهاتف</span><strong>${escapeHtml(contact.phone)}</strong></div>` : ""}</div>
    ${bodyHtml}
    <div class="words">${totalLabel}: ${escapeHtml(numberToArabicWords(totalValue))} دينار ليبي فقط لا غير</div>
    <div class="signatures"><div><div class="signature-line">توقيع المحاسب</div></div><div><div class="signature-line">توقيع ${isSupplier ? "المورّد" : "الزبون"}</div></div></div>
    <div class="footer">شركة مجموعة الشرق الكبرى للطلاء الخارجي</div>
  </main></body></html>`;
  printWindow.document.open(); printWindow.document.write(html); printWindow.document.close();
  let printed = false;
  const triggerPrint = () => { if (printed) return; printed = true; try { printWindow.focus(); printWindow.print(); } catch (error) { console.error("Print failed:", error); } };
  printWindow.onload = triggerPrint;
  window.setTimeout(triggerPrint, 700);
}
function WaiveInline({ remaining, waived, onApply, onReset }) {
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  if (remaining <= 0 && waived <= 0) return null;
  const apply = () => {
    if (!positiveNumber(amount) || Number(amount) > remaining) { notify("أدخل مبلغًا موجبًا لا يتجاوز الباقي."); return; }
    onApply(Number(amount), note.trim());
    setAmount(""); setNote("");
  };
  return <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}><div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>التغاضي عن جزء من المبلغ</div>{remaining > 0 && <><div className="flex gap-2"><TextInput type="number" placeholder={`المبلغ (الباقي ${fmt(remaining)})`} value={amount} onChange={(e) => setAmount(e.target.value)} /><TextInput placeholder="سبب (اختياري)" value={note} onChange={(e) => setNote(e.target.value)} /></div><div className="flex gap-2 flex-wrap"><GhostButton onClick={apply}>تغاضي عن المبلغ</GhostButton><GhostButton onClick={() => setAmount(String(remaining))}>كامل الباقي</GhostButton></div></>}{waived > 0 && <div className="flex items-center justify-between text-xs" style={{ color: "var(--text-muted)" }}><span>إجمالي المتغاضى عنه: {fmt(waived)}</span><button onClick={onReset} style={{ color: "#A34632" }}>إلغاء التغاضي</button></div>}</div>;
}

function ProjectDetail({ project, onClose, onSave, onDelete, onDeletePayment, onAddPayment, customers, upsertCustomer, income = [] }) {
  const [sub, setSub] = useState("info");
  const [local, setLocal] = useState(project);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [pendingPaymentDelete, setPendingPaymentDelete] = useState(null);
  useEffect(() => setLocal(project), [project.id]);
  const update = (patch) => { const next = { ...local, ...patch }; setLocal(next); onSave(next); };
  const sm = getProjectSummary(local, income);
  const projectPayments = getProjectPayments(local, income);
  const addPayment = (payment) => {
    const next = { ...local, payments: [payment, ...(local.payments || [])] };
    setLocal(next);
    onAddPayment(next, payment);
  };
  const removePayment = (payment) => {
    const paymentId = payment.paymentId || payment.id;
    update({ payments: (local.payments || []).filter((item) => (item.paymentId || item.id) !== paymentId) });
    onDeletePayment(payment);
    setPendingPaymentDelete(null);
  };
  const waive = (amount, note) => update({ waivedAmount: Math.min(sm.cost, Number(local.waivedAmount || 0) + amount), waiveNote: note || local.waiveNote || "" });
  const projectStatusLabel = sm.remaining > 0 ? "الباقي" : sm.surplus > 0 ? "رصيد للزبون" : sm.advance > 0 ? "مقدّم زائد" : "الحالة";
  const projectStatusValue = sm.remaining > 0 ? fmt(sm.remaining) : sm.surplus > 0 ? fmt(sm.surplus) : sm.advance > 0 ? fmt(sm.advance) : sm.settled ? "خالص" : "بانتظار الكيل";
  const projectStatusColor = sm.remaining > 0 ? "#A34632" : "#4B6350";
  const projectStatusBg = sm.remaining > 0 ? "var(--warn-bg)" : "var(--good-bg)";

  return (
    <Modal title={`مشروع — ${local.customerName}`} onClose={onClose} wide>
      <div className="flex items-center gap-1.5 mb-4 flex-wrap">
        {[{ k: "info", l: "المعلومات", icon: "user" }, { k: "items", l: "المنتجات المرسلة", icon: "truck" }, { k: "measure", l: "المكاييل", icon: "ruler" }].map((t) => (
          <button key={t.k} onClick={() => setSub(t.k)} className="text-xs px-3 py-2 rounded-lg border flex items-center gap-1.5 transition" style={sub === t.k ? { background: "var(--accent)", borderColor: "var(--accent)", color: "white" } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-body)" }}>
            <Icon name={t.icon} size={13} /> {t.l}
          </button>
        ))}
      </div>

      {sub === "info" && (
        <div className="flex flex-col gap-3">
          <div>
            <FieldLabel>العميل</FieldLabel>
            <CustomerPicker customers={customers} customerId={local.customerId} customerName={local.customerName}
              onSelect={(id) => { const c = customers.find((x) => x.id === id); update({ customerId: id, customerName: c ? c.name : local.customerName }); }}
              onCreateNew={(c) => { upsertCustomer(c); update({ customerId: c.id, customerName: c.name }); }} />
          </div>
          <div className="grid sm:grid-cols-2 gap-3">
            <div><FieldLabel>رقم الهاتف لهذا المشروع</FieldLabel><TextInput value={local.phone} onChange={(e) => update({ phone: e.target.value })} /></div>
            <div><FieldLabel>الموقع</FieldLabel><TextInput value={local.location} onChange={(e) => update({ location: e.target.value })} /></div>
            <div><FieldLabel>نوع المنتج</FieldLabel><Select value={local.productType} onChange={(e) => update({ productType: e.target.value })}>{PRODUCT_TYPES.map((t) => <option key={t}>{t}</option>)}</Select></div>
            <div><FieldLabel>تاريخ الإنشاء</FieldLabel><TextInput type="date" value={local.dateCreated || ""} onChange={(e) => update({ dateCreated: e.target.value })} /></div>
          </div>
          <div>
            <FieldLabel>الحالة</FieldLabel>
            <Select value={local.status} onChange={(e) => update({ status: e.target.value, completedAt: e.target.value === "مكتمل" ? (local.completedAt || todayISO()) : null })}>{STATUSES.map((s) => <option key={s}>{s}</option>)}</Select>
            <div className="text-xs mt-1" style={{ color: "var(--text-muted)" }}>تتحدّث هذه الحالة تلقائيًا: «قيد التنفيذ» عند أول حركة بضاعة، و«مكتمل» عند أول كيل — ويمكنك تعديلها يدويًا عند الحاجة.</div>
          </div>
          <div><FieldLabel>ملاحظات</FieldLabel><textarea value={local.notes} onChange={(e) => update({ notes: e.target.value })} rows={2} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ background: "var(--input-bg)", borderColor: "var(--card-border)", color: "var(--text-strong)" }} /></div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-sm mt-1">
            <div className="rounded-xl p-3" style={{ background: "var(--divider)" }}><div className="text-xs" style={{ color: "var(--text-muted)" }}>التكلفة الإجمالية</div><div className="font-bold mt-1" style={{ color: "var(--text-strong)" }}>{fmt(sm.cost)}</div></div>
            <div className="rounded-xl p-3" style={{ background: "var(--good-bg)" }}><div className="text-xs" style={{ color: "var(--text-muted)" }}>الواصل</div><div className="font-bold mt-1" style={{ color: "#4B6350" }}>{fmt(sm.paid)}</div></div>
            {sm.waived > 0 && <div className="rounded-xl p-3" style={{ background: "var(--divider)" }}><div className="text-xs" style={{ color: "var(--text-muted)" }}>متغاضى عنه</div><div className="font-bold mt-1" style={{ color: "var(--text-strong)" }}>{fmt(sm.waived)}</div></div>}
            <div className="rounded-xl p-3" style={{ background: projectStatusBg }}><div className="text-xs" style={{ color: "var(--text-muted)" }}>{projectStatusLabel}</div><div className="font-bold mt-1" style={{ color: projectStatusColor }}>{projectStatusValue}</div></div>
          </div>
          <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
            <div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>دفعات المشروع</div>
            {projectPayments.length === 0 ? <div className="text-xs" style={{ color: "var(--text-muted)" }}>لا توجد دفعات مسجّلة لهذا المشروع.</div> : projectPayments.map((payment) => {
              const paymentId = payment.paymentId || payment.id;
              return <div key={paymentId} className="flex items-center justify-between gap-2 py-2 border-b last:border-b-0" style={{ borderColor: "var(--divider)" }}>
                <div className="min-w-0"><div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>{fmt(payment.amount)}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{payment.date || "بدون تاريخ"}{payment.description ? " · " + payment.description : ""}</div></div>
                <div className="flex items-center gap-2 shrink-0">{payment.includeInIncome === false ? <Badge bg="var(--divider)" fg="var(--text-muted)">غير محتسب كـوارد</Badge> : <Badge bg="var(--good-bg)" fg="#4B6350">محتسب كـوارد</Badge>}{pendingPaymentDelete === paymentId ? <ConfirmInline label="حذف الدفعة؟" onConfirm={() => removePayment(payment)} onCancel={() => setPendingPaymentDelete(null)} /> : <button onClick={() => setPendingPaymentDelete(paymentId)} className="text-xs flex items-center gap-1" style={{ color: "#A34632" }}><Icon name="trash" size={13} /> حذف</button>}</div>
              </div>;
            })}
          </div>
          <div className="flex gap-2">
            <GhostButton onClick={() => printProjectInvoice(local, income)}><Icon name="download" size={14} /> طباعة فاتورة القياس</GhostButton>
          </div>
          {local.status !== "مكتمل" && <PrimaryButton full onClick={() => update({ status: "مكتمل", completedAt: todayISO() })}><Icon name="check" size={16} /> إنهاء المشروع يدويًا</PrimaryButton>}
          <RecordIncomeInline project={local} onAdd={addPayment} />
          <WaiveInline remaining={sm.remaining} waived={sm.waived} onApply={waive} onReset={() => update({ waivedAmount: 0, waiveNote: "" })} />
          <div className="pt-3 border-t flex justify-end" style={{ borderColor: "var(--card-border)" }}>
            {confirmDelete ? <ConfirmInline label="حذف المشروع نهائيًا؟" onConfirm={onDelete} onCancel={() => setConfirmDelete(false)} /> : <button onClick={() => setConfirmDelete(true)} className="text-xs flex items-center gap-1" style={{ color: "#A34632" }}><Icon name="trash" size={13} /> حذف المشروع</button>}
          </div>
        </div>
      )}
      {sub === "items" && <ProjectItems project={local} update={update} />}
      {sub === "measure" && <ProjectMeasurements project={local} update={update} />}
    </Modal>
  );
}

function RecordIncomeInline({ project, onAdd }) {
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  const [includeInIncome, setIncludeInIncome] = useState(true);
  const submit = () => {
    if (!positiveNumber(amount)) { notify("أدخل مبلغًا موجبًا."); return; }
    onAdd({ id: uid(), date: todayISO(), amount: Number(amount), includeInIncome, description: note.trim() || "دفعة من الزبون" });
    setAmount(""); setNote(""); setIncludeInIncome(true);
  };
  return (
    <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
      <div className="text-sm font-medium flex items-center gap-1.5" style={{ color: "var(--text-body)" }}><Icon name="wallet" size={14} /> تسجيل وارد من الزبون</div>
      <div className="flex gap-2"><TextInput type="number" placeholder="المبلغ المستلم" value={amount} onChange={(e) => setAmount(e.target.value)} /><TextInput placeholder="ملاحظة (اختياري)" value={note} onChange={(e) => setNote(e.target.value)} /></div>
      <label className="flex items-center gap-2 text-xs" style={{ color: "var(--text-body)" }}><input type="checkbox" checked={includeInIncome} onChange={(e) => setIncludeInIncome(e.target.checked)} /> احتساب الدفعة ضمن الواردات</label>
      <GhostButton onClick={submit}><Icon name="plus" size={14} /> إضافة الدفعة</GhostButton>
    </div>
  );
}

function ProjectItems({ project, update }) {
  const [direction, setDirection] = useState("إرسال");
  const [name, setName] = useState("");
  const [quantity, setQuantity] = useState("");
  const [unit, setUnit] = useState("كيس");
  const [pendingDelete, setPendingDelete] = useState(null);
  const items = project.items || [];
  const addItem = () => {
    if (!name.trim() || !positiveNumber(quantity)) { notify("أدخل كمية موجبة."); return; }
    const entry = { id: uid(), date: todayISO(), direction, name: name.trim(), quantity: Number(quantity), unit };
    const patch = { items: [entry, ...items] };
    if (project.status === "جديد") patch.status = "قيد التنفيذ";
    update(patch);
    setName(""); setQuantity("");
  };
  const removeItem = (id) => { update({ items: items.filter((i) => i.id !== id) }); setPendingDelete(null); };
  const DIR_ICON = { "إرسال": { icon: "truck", fg: "#4B6350" }, "مرتجع": { icon: "rotate", fg: "#A34632" }, "إضافة": { icon: "plus", fg: "#8A6A32" } };
  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
        <div className="grid grid-cols-3 gap-2">
          <Select value={direction} onChange={(e) => setDirection(e.target.value)}><option value="إرسال">إرسال</option><option value="مرتجع">مرتجع</option><option value="إضافة">إضافة</option></Select>
          <TextInput list="item-suggestions" placeholder="اسم المادة" value={name} onChange={(e) => setName(e.target.value)} />
          <Select value={unit} onChange={(e) => setUnit(e.target.value)}><option>كيس</option><option>لتر</option><option>م</option><option>قطعة</option></Select>
        </div>
        <datalist id="item-suggestions">{ITEM_SUGGESTIONS.map((s) => <option key={s} value={s} />)}</datalist>
        <div className="flex gap-2"><TextInput type="number" placeholder="الكمية" value={quantity} onChange={(e) => setQuantity(e.target.value)} /><PrimaryButton onClick={addItem}><Icon name="plus" size={16} /> تسجيل</PrimaryButton></div>
      </div>
      {items.length === 0 ? <EmptyState icon="truck" title="لا توجد حركات بضاعة مسجّلة" /> : (
        <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
          {items.map((i) => {
            const D = DIR_ICON[i.direction] || DIR_ICON["إرسال"];
            return (
              <div key={i.id} className="flex items-center justify-between py-2.5 gap-2" style={{ borderColor: "var(--divider)" }}>
                <div className="flex items-center gap-2 min-w-0"><Icon name={D.icon} size={14} color={D.fg} /><div className="min-w-0"><div className="text-sm truncate" style={{ color: "var(--text-body)" }}>{i.name}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{i.direction} · {i.date}</div></div></div>
                <div className="flex items-center gap-3 shrink-0">
                  <span className="text-sm font-medium" style={{ color: "var(--text-body)" }}>{fmt(i.quantity)} {i.unit}</span>
                  {pendingDelete === i.id ? <ConfirmInline onConfirm={() => removeItem(i.id)} onCancel={() => setPendingDelete(null)} /> : <button onClick={() => setPendingDelete(i.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ProjectMeasurements({ project, update }) {
  const [workerName, setWorkerName] = useState("");
  const [entries, setEntries] = useState([{ label: "تكس", quantity: "", unitPrice: "", total: "" }]);
  const [pendingDelete, setPendingDelete] = useState(null);
  const [editingMeasurementId, setEditingMeasurementId] = useState(null);
  const measurements = project.measurements || [];
  const setEntry = (idx, patch) => setEntries((prev) => prev.map((e, i) => { if (i !== idx) return e; const next = { ...e, ...patch }; if (next.quantity && next.unitPrice) next.total = String(Number(next.quantity) * Number(next.unitPrice)); return next; }));
  const addRow = () => setEntries((prev) => [...prev, { label: "", quantity: "", unitPrice: "", total: "" }]);
  const removeRow = (idx) => setEntries((prev) => prev.filter((_, i) => i !== idx));
  const sum = entries.reduce((s, e) => s + Number(e.total || 0), 0);
  const submit = () => {
    if (!workerName.trim()) { notify("أدخل اسم العامل."); return; }
    const cleanEntries = entries.filter((e) => e.label.trim() && positiveNumber(e.total) && nonNegativeNumber(e.quantity || 0) && nonNegativeNumber(e.unitPrice || 0)).map((e) => ({ ...e, quantity: Number(e.quantity || 0), unitPrice: Number(e.unitPrice || 0), total: Number(e.total) }));
    if (cleanEntries.length === 0) { notify("أدخل بنود قياس صحيحة وبقيم غير سالبة."); return; }
    const editingMeasurement = measurements.find((measurement) => measurement.id === editingMeasurementId);
    const record = { id: editingMeasurement?.id || uid(), date: editingMeasurement?.date || todayISO(), workerName: workerName.trim(), entries: cleanEntries, totalAmount: cleanEntries.reduce((s, e) => s + e.total, 0) };
    const patch = { measurements: editingMeasurement ? measurements.map((measurement) => measurement.id === editingMeasurementId ? record : measurement) : [record, ...measurements] };
    if (!editingMeasurement && project.status !== "مكتمل") { patch.status = "مكتمل"; patch.completedAt = project.completedAt || todayISO(); }
    update(patch);
    setWorkerName(""); setEntries([{ label: "تكس", quantity: "", unitPrice: "", total: "" }]); setEditingMeasurementId(null);
  };
  const startEditing = (measurement) => {
    setEditingMeasurementId(measurement.id);
    setWorkerName(measurement.workerName || "");
    setEntries((measurement.entries || []).map((entry) => ({ ...entry, quantity: String(entry.quantity ?? ""), unitPrice: String(entry.unitPrice ?? ""), total: String(entry.total ?? "") })));
    setPendingDelete(null);
  };
  const cancelEditing = () => {
    setEditingMeasurementId(null);
    setWorkerName("");
    setEntries([{ label: "تكس", quantity: "", unitPrice: "", total: "" }]);
  };
  const removeMeasurement = (id) => { update({ measurements: measurements.filter((m) => m.id !== id) }); setPendingDelete(null); };
  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-xl border p-3 flex flex-col gap-3" style={{ borderColor: "var(--card-border)" }}>
        <div><FieldLabel>اسم العامل (الذي كال العمل)</FieldLabel><TextInput value={workerName} onChange={(e) => setWorkerName(e.target.value)} placeholder="اسم العامل" /></div>
        <div className="flex flex-col gap-2">
          {entries.map((e, idx) => (
            <div key={idx} className="grid grid-cols-2 sm:grid-cols-12 gap-1.5 items-center">
              <div className="col-span-2 sm:col-span-3 min-w-0"><TextInput list="measure-suggestions" placeholder="البند" value={e.label} onChange={(ev) => setEntry(idx, { label: ev.target.value })} /></div>
              <div className="col-span-1 sm:col-span-3 min-w-0"><TextInput type="number" placeholder="الكمية (م)" value={e.quantity} onChange={(ev) => setEntry(idx, { quantity: ev.target.value })} /></div>
              <div className="col-span-1 sm:col-span-3 min-w-0"><TextInput type="number" placeholder="سعر الوحدة" value={e.unitPrice} onChange={(ev) => setEntry(idx, { unitPrice: ev.target.value })} /></div>
              <div className="col-span-1 sm:col-span-2 min-w-0"><TextInput type="number" placeholder="المجموع" value={e.total} onChange={(ev) => setEntry(idx, { total: ev.target.value })} /></div>
              <div className="col-span-2 sm:col-span-1 flex justify-center">{entries.length > 1 && <button onClick={() => removeRow(idx)} style={{ color: "var(--text-muted)" }}><Icon name="x" size={14} /></button>}</div>
            </div>
          ))}
          <datalist id="measure-suggestions">{["تكس", "سيليكات", "مرمات", "جوتن", "نايلو"].map((s) => <option key={s} value={s} />)}</datalist>
          <button onClick={addRow} className="text-xs flex items-center gap-1 self-start" style={{ color: "var(--accent)" }}><Icon name="plus" size={12} /> إضافة بند</button>
        </div>
        <div className="flex items-center justify-between border-t pt-2" style={{ borderColor: "var(--divider)" }}><span className="text-sm" style={{ color: "var(--text-muted)" }}>مجموع هذا الكيل</span><span className="font-bold" style={{ color: "var(--text-strong)" }}>{fmt(sum)}</span></div>
        <div className="flex gap-2">
          <PrimaryButton onClick={submit} full><Icon name={editingMeasurementId ? "check" : "plus"} size={16} /> {editingMeasurementId ? "حفظ تعديل الكيل" : "حفظ الكيل"}</PrimaryButton>
          {editingMeasurementId && <GhostButton onClick={cancelEditing}>إلغاء</GhostButton>}
        </div>
      </div>
      {measurements.length === 0 ? <EmptyState icon="ruler" title="لا توجد مكاييل مسجّلة بعد" /> : (
        <div className="flex flex-col gap-2">
          {measurements.map((m) => (
            <div key={m.id} className="rounded-xl border p-3" style={{ borderColor: "var(--card-border)" }}>
              <div className="flex items-center justify-between mb-2">
                <div className="text-sm font-medium flex items-center gap-1.5" style={{ color: "var(--text-body)" }}><Icon name="user" size={13} /> {m.workerName}<span style={{ color: "var(--text-muted)" }}>·</span><span className="font-normal flex items-center gap-1" style={{ color: "var(--text-muted)" }}><Icon name="calendar" size={11} /> {m.date}</span></div>
                {pendingDelete === m.id ? <ConfirmInline onConfirm={() => removeMeasurement(m.id)} onCancel={() => setPendingDelete(null)} /> : <div className="flex items-center gap-3"><button onClick={() => startEditing(m)} className="text-xs" style={{ color: "var(--accent)" }}>تعديل</button><button onClick={() => setPendingDelete(m.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button></div>}
              </div>
              <div className="flex flex-col gap-1">{m.entries.map((e, i) => <div key={i} className="flex items-center justify-between text-xs" style={{ color: "var(--text-muted)" }}><span>{e.label} {e.quantity ? `(${fmt(e.quantity)} × ${fmt(e.unitPrice)})` : ""}</span><span className="font-medium" style={{ color: "var(--text-body)" }}>{fmt(e.total)}</span></div>)}</div>
              <div className="flex items-center justify-between border-t mt-2 pt-2 text-sm" style={{ borderColor: "var(--divider)" }}><span style={{ color: "var(--text-muted)" }}>المجموع</span><span className="font-bold" style={{ color: "var(--text-strong)" }}>{fmt(m.totalAmount)}</span></div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
